<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1 Lessons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
/* Layout: one left-aligned reading column on a school-exercise-book page.
   Squared paper (Karopapier) only behind the headword; royal-blue ink for German,
   teacher's red pen for mistakes. The headword's "weil" stretches: a long while. */
:root {
  --paper: #F6F8FA;
  --ink: #18233A;
  --muted: #56627A;
  --blue: #2340B0;      /* Königsblau fountain-pen ink */
  --red: #C42B2B;       /* correction pen */
  --rule: #D3DEEA;      /* grid and table lines */
  --tint: #E9EEF7;
  --display: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --body: "Literata", "Iowan Old Style", Georgia, serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111827; --ink: #E5EAF3; --muted: #9AA6BD; --blue: #93A8FF;
    --red: #FF8A80; --rule: #2A3650; --tint: #1A2440; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111827; --ink: #E5EAF3; --muted: #9AA6BD; --blue: #93A8FF;
  --red: #FF8A80; --rule: #2A3650; --tint: #1A2440; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--body); font-size: 1.075rem; line-height: 1.7;
}
.sheet { max-width: 46rem; margin: 0 auto; padding: 0 clamp(16px, 5vw, 32px) 4rem; }
p { margin: 0; }
h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.2; }
h2 { font-size: 1.65rem; font-weight: 600; }
h3 { font-size: 1.15rem; font-weight: 600; }
.de { color: var(--blue); }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; border-radius: 2px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; gap: .75rem 1rem; align-items: center; justify-content: space-between;
  padding: 1.1rem 0; font-family: var(--display); font-size: .95rem; color: var(--muted); }
.bar-actions { display: flex; gap: .5rem; flex-wrap: wrap; }
.btn { font: 500 .92rem var(--display); color: var(--ink); background: transparent;
  border: 1.5px solid var(--rule); border-radius: 6px; padding: .4rem .85rem; cursor: pointer; }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.btn.primary { background: var(--blue); border-color: var(--blue); color: var(--paper); }
.btn.primary:hover { filter: brightness(1.1); color: var(--paper); }
#file { position: absolute; width: 1px; height: 1px; opacity: 0; }
#file:focus-visible + .btn { outline: 2px solid var(--blue); outline-offset: 3px; }

/* lesson picker (when the page holds several lessons) */
.picker { display: flex; flex-wrap: wrap; gap: .35rem 1.25rem; padding: 0 0 1rem; font-family: var(--display); font-size: 1.05rem; }
.picker[hidden], .finder[hidden] { display: none; }
.picker { max-height: 9.5rem; overflow-y: auto; }
.finder { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; padding-bottom: .75rem; font-family: var(--display); }
.finder label { color: var(--muted); font-size: .95rem; }
.finder input { font: 400 1rem var(--display); color: var(--ink); background: var(--paper); border: 1.5px solid var(--rule);
  border-radius: 6px; padding: .4rem .7rem; width: min(100%, 18rem); }
.finder input:focus-visible { outline: none; border-color: var(--blue); box-shadow: 0 0 0 3px var(--tint); }
#find-count { color: var(--muted); font-size: .9rem; }
.picker a { color: var(--muted); text-decoration: none; padding: .1rem 0; border-bottom: 2px solid transparent; }
.picker a:hover { color: var(--blue); }
.picker a[aria-current="page"] { color: var(--blue); border-bottom-color: var(--blue); }
.picker .card-word { font-style: italic; }

/* hero */
.hero {
  margin: 0 calc(-1 * clamp(16px, 5vw, 32px));
  padding: clamp(2rem, 6vw, 3.5rem) clamp(16px, 5vw, 32px) 2.5rem;
  background-image:
    linear-gradient(var(--rule) 1px, transparent 1px),
    linear-gradient(90deg, var(--rule) 1px, transparent 1px);
  background-size: 22px 22px;
  background-position: -1px -1px;
  border-bottom: 1px solid var(--rule);
  display: grid; gap: .9rem;
}
.pos { font-family: var(--display); color: var(--muted); font-size: 1rem; }
.headword {
  font-family: var(--display); font-weight: 500; margin: 0;
  font-size: clamp(3rem, 13vw, 7.25rem); line-height: 1; letter-spacing: -.02em;
  white-space: nowrap; overflow-x: auto; padding-bottom: .1em;
}
.seg.stretch { color: var(--blue); letter-spacing: .32em; margin-right: -.06em;
  animation: stretch 2.6s cubic-bezier(.45,0,.2,1) .3s both; }
@keyframes stretch { from { letter-spacing: -.02em; } to { letter-spacing: .32em; } }
@media (max-width: 30rem) { .seg.stretch { letter-spacing: .14em; animation-name: stretch-sm; } }
@keyframes stretch-sm { from { letter-spacing: -.02em; } to { letter-spacing: .14em; } }
.seg.arrive { display: inline-block; color: var(--blue);
  animation: arrive 1.8s cubic-bezier(.15,.7,.2,1) .3s both; }
@keyframes arrive { from { transform: translateX(1.1em); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) { .seg.stretch, .seg.arrive { animation: none; } }
.meaning { font-size: clamp(1.5rem, 4vw, 2rem); font-style: italic; line-height: 1.3; }
.say { display: flex; flex-wrap: wrap; gap: .4rem 1.5rem; color: var(--muted); font-size: 1rem; }
.say b { font-family: var(--display); font-weight: 500; color: var(--ink); }
.say-note { color: var(--muted); font-size: .95rem; max-width: 36rem; }

/* sections */
main { display: grid; gap: 3.5rem; padding-top: 2.75rem; }
section { display: grid; gap: 1.1rem; }
.prose { display: grid; gap: .9rem; max-width: 40rem; }

/* etymology equation */
.equation { display: flex; flex-wrap: wrap; align-items: flex-start; gap: .5rem 1rem; }
.term { display: grid; gap: .15rem; }
.term .word { font-family: var(--display); font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.1; color: var(--blue); }
.term .gloss { font-size: .95rem; color: var(--muted); max-width: 11rem; line-height: 1.45; }
.op { font-family: var(--display); font-size: clamp(1.8rem, 6vw, 2.5rem); line-height: 1.1; color: var(--muted); }
.literal { font-size: 1.15rem; }
.literal q { font-family: var(--display); font-weight: 500; color: var(--blue); quotes: "“" "”"; }
.aside { border-left: 3px solid var(--blue); padding: .2rem 0 .2rem 1.1rem; display: grid; gap: .4rem; max-width: 40rem; }

/* word family */
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 30rem; }
th, td { text-align: left; padding: .7rem 1rem .7rem 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--display); font-weight: 500; color: var(--muted); font-size: .95rem; }
td:first-child { font-family: var(--display); font-weight: 500; font-size: 1.1rem; color: var(--blue); white-space: nowrap; }
td .lit { color: var(--muted); font-style: italic; }

/* form tables (declension, conjugation) */
.decl { min-width: 32rem; }
.decl th[scope="row"] { font-family: var(--display); font-weight: 500; color: var(--ink); font-size: 1rem; }
.decl th[scope="row"] span { display: block; font-family: var(--body); font-weight: 400; font-size: .85rem; color: var(--muted); }
.decl td, .decl td:first-child { font-family: var(--display); font-size: 1.35rem; color: var(--ink); font-weight: 400; }
.decl mark { font-weight: 500; }
.patterns { margin: 0; padding-left: 1.2rem; display: grid; gap: .45rem; max-width: 40rem; }
.patterns li::marker { color: var(--blue); }

/* cognates */
.cognates { display: flex; flex-wrap: wrap; gap: 1rem 2.25rem; }
.cognate { display: grid; gap: .1rem; }
.cognate .lang { font-size: .9rem; color: var(--muted); }
.cognate .word { font-family: var(--display); font-size: 1.6rem; line-height: 1.15; color: var(--blue); }
.cognate .gloss { font-size: .9rem; color: var(--muted); max-width: 12rem; line-height: 1.4; }

/* headword that cycles through its forms */
.seg.ending { color: var(--blue); }

/* the trap: teacher's red pen */
.trap { display: grid; gap: 1.25rem; padding: 1.5rem; background: var(--tint); border-radius: 4px; }
.wrong-line { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1rem; }
.struck { font-family: var(--display); font-size: 1.6rem; text-decoration: line-through; text-decoration-color: var(--red);
  text-decoration-thickness: 3px; }
.red-note { color: var(--red); font-style: italic; }
.right-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .85rem; }
.right-list li { display: grid; gap: .1rem; }
.right-list .de { font-family: var(--display); font-size: 1.35rem; font-weight: 500; }
.right-list .note { color: var(--muted); font-size: .97rem; }

/* mistakes */
.mistakes { display: grid; gap: 2rem; }
.mistake { display: grid; gap: .55rem; }
.fix { display: flex; flex-wrap: wrap; gap: .3rem 1.5rem; font-family: var(--display); font-size: 1.15rem; }
.fix .x { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; color: var(--muted); }
.fix .ok { color: var(--blue); font-weight: 500; }
.examples { list-style: none; padding: 0; margin: 0; display: grid; gap: .35rem; }
.examples .de { font-family: var(--display); font-size: 1.15rem; }
.decl mark, .examples mark { background: none; color: var(--blue); font-weight: 600; border-bottom: 2px solid var(--blue); }
.examples .en { color: var(--muted); }
.forms { display: flex; flex-wrap: wrap; gap: .75rem 2.25rem; }
.forms div { display: grid; }
.forms span { font-size: .9rem; color: var(--muted); }
.forms b { font-family: var(--display); font-weight: 500; font-size: 1.2rem; color: var(--blue); }

/* sentences */
.sent-head { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: space-between; align-items: baseline; }
.sentences { list-style: none; margin: 0; padding: 0; display: grid; }
.sentences li { padding: .85rem 0; border-bottom: 1px solid var(--rule); display: grid; gap: .15rem; }
.sentences li:first-child { border-top: 1px solid var(--rule); }
.sentences .de { font-size: 1.15rem; color: var(--ink); }
.sentences .hl { font-weight: 600; }
.sentences .en { color: var(--muted); font-style: italic; }
.sentences.hide-en .en { visibility: hidden; }
.sentences.hide-en li:hover .en, .sentences.hide-en li:focus-within .en { visibility: visible; }
.sentences li[tabindex]:focus-visible { outline-offset: 0; }
.hl { color: var(--blue); }

/* quiz */
.quiz { list-style: none; margin: 0; padding: 0; display: grid; gap: 1.75rem; counter-reset: q; }
.quiz > li { display: grid; gap: .7rem; grid-template-columns: 2rem 1fr; }
.quiz > li::before { counter-increment: q; content: counter(q); font-family: var(--display); font-weight: 600;
  color: var(--blue); font-size: 1.2rem; line-height: 1.5; }
.quiz .body { display: grid; gap: .7rem; }
.row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.row input { font: 500 1.05rem var(--display); color: var(--ink); background: var(--paper);
  border: 1.5px solid var(--rule); border-radius: 6px; padding: .4rem .7rem; width: 9rem; }
.row input:focus-visible { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--tint); }
.feedback { font-size: .98rem; }
.btn.opt { font-size: 1.05rem; min-width: 3.5rem; }
.btn.opt.picked-good { border-color: var(--blue); background: var(--tint); color: var(--blue); }
.btn.opt.picked-bad { border-color: var(--red); color: var(--red); text-decoration: line-through; }
.feedback.good { color: var(--blue); }
.feedback.bad { color: var(--red); }
.answer { display: grid; gap: .25rem; padding-left: 1rem; border-left: 3px solid var(--blue); }
.answer .de { font-family: var(--display); font-weight: 500; font-size: 1.15rem; }
.answer .note { color: var(--muted); }
.answer[hidden] { display: none; }

/* hook */
.hook { padding-top: 2.5rem; border-top: 1px solid var(--rule); display: grid; gap: 1rem; }
.hook p.big { font-family: var(--display); font-size: clamp(1.35rem, 4vw, 1.75rem); line-height: 1.35; text-wrap: balance; }
.signoff { color: var(--blue); font-style: italic; font-size: 1.2rem; }

/* json view / errors */
.panel { border: 1.5px solid var(--rule); border-radius: 6px; padding: 1rem; overflow: auto; max-height: 28rem;
  font: .85rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace; white-space: pre; margin: 0 0 1.5rem; }
.panel[hidden] { display: none; }
.error { border-left: 3px solid var(--red); padding: .5rem 1rem; color: var(--red); margin-bottom: 1.5rem; }
</style>
</head>
<body>
<div class="sheet">
  <div class="bar">
    <span id="pair">German vocabulary</span>
    <div class="bar-actions">
      <input type="file" id="file" accept=".json,application/json">
      <label for="file" class="btn">Open lesson file</label>
      <button type="button" class="btn" id="toggle-json" aria-expanded="false" aria-controls="json-view">Show JSON</button>
    </div>
  </div>
  <div id="finder" class="finder" hidden><label for="find">Find a word</label><input id="find" type="search" autocomplete="off" spellcheck="false" placeholder="e.g. fährt, Wohnung, mit"><span id="find-count"></span></div>
  <nav id="picker" class="picker" aria-label="Lessons" hidden></nav>
  <div id="error" class="error" role="alert" hidden></div>
  <pre id="json-view" class="panel" hidden></pre>
  <div id="lesson"></div>
</div>

"], "answer": "a-DRES-se", "explanation": "Unlike English, the stress is on the second syllable.", "id": "q3"}, {"type": "fill-in-the-blank", "prompt": "Wie ist Ihre ___? (address)", "answer": "Adresse", "fullAnswer": "Wie ist Ihre Adresse?", "explanation": "Adresse with double s and an e at the end.", "id": "q4"}, {"type": "choice", "prompt": "Which spelling is correct?", "options": ["Adress", "Adresse", "Addresse"], "answer": "Adresse", "explanation": "One d, two s, and an e at the end.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "full", "word": {"headword": "all-", "partOfSpeech": "determiner and pronoun (alle, alles)", "pronunciation": {"respelling": "AHL-uh, AHL-es", "ipa": "ˈalə, ˈaləs", "notes": "Short a, double l."}, "meaning": "all; alle = everyone, alles = everything", "shortDefinition": "The whole of something, or every one of a group."}, "intro": {"title": "Alles klar?", "paragraphs": ["You'll hear alles klar a dozen times a day: everything clear, all good. The word is all-, and its ending tells you what it refers to: alle for people or plural things, alles for 'everything'."]}, "etymology": {"title": "Where it comes from", "summary": "All- is the same word as English 'all'. It also hides in allein: all + ein, 'all one'.", "cognates": [{"word": "all", "language": "English"}, {"word": "al, alle", "language": "Dutch"}]}, "tables": [{"title": "Which ending?", "columns": ["form", "meaning", "example"], "rows": [{"label": "alle", "cells": ["all|e", "all, everyone (plural)", "Alle sind da."]}, {"label": "alles", "cells": ["all|es", "everything", "Alles ist gut."]}, {"label": "allen", "cells": ["all|en", "to/with all (dative)", "mit allen Freunden"]}]}], "wordFamily": [{"german": "Alles klar!", "english": "All right! Got it!", "type": "phrase"}, {"german": "Alles Gute!", "english": "All the best!", "type": "phrase"}, {"german": "allein", "e ype": "choice", "prompt": "Where's the stress?", "options": ["AL-lein", "al-LEIN"], "answer": "al-LEIN", "explanation": "Stress the second syllable.", "id": "q2"}, {"type": "fill-in-the-blank", "prompt": "Er fährt ___ in den Urlaub. (alone)", "answer": "allein", "fullAnswer": "Er fährt allein in den Urlaub.", "explanation": "Allein: alone.", "id": "q3"}, {"type": "choice", "prompt": "The opposite of allein is…", "options": ["zusammen", "alles"], "answer": "zusammen", "explanation": "Zusammen: together.", "id": "q4"}, {"type": "choice", "prompt": "Allein is built from…", "options": ["all + ein", "alle + in"], "answer": "all + ein", "explanation": "Like English 'alone' from 'all one'.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "full", "word": {"headword": "also", "partOfSpeech": "adverb / particle", "pronunciation": {"respelling": "AHL-zoh", "ipa": "ˈalzo", "notes": "The s sounds like z."}, "meaning": "so, therefore; well…", "shortDefinition": "Draws a conclusion or starts a thought."}, "intro": {"title": "Also doesn't mean 'also'", "paragraphs": ["Also looks exactly like the English word, but it means 'so' or 'therefore'. Germans also use it the way English speakers say 'so…' or 'well…' to start a sentence. For 'also', German says auch."]}, "wordFamily": [{"german": "auch", "english": "also, too", "type": "adverb"}, {"german": "deshalb", "english": "that's why", "type": "adverb"}, {"german": "Also gut!", "english": "All right then!", "type": "phrase"}], "keyTrap": {"title": "The big trap: also is 'so'", "explanation": "When you mean 'too' or 'as well', you need auch.", "wrong": {"german": "Ich spreche also Englisch.", "verdict": "This means 'So I speak English.'"}, "correct": [{"german": "Ich spreche auch Englisch.", "literal": "I speak also English.", "note": "Too, as well: auch."}, {"german": "Es regnet, also bleiben wir zu Hause.", "literal": "It's raining, so we stay at home.", "note": "Therefore: also."}]}, "commonMistakes": [{"title": "Word order after also", "explanation": "When also starts the clause, the verb comes right after it.", "wrong": "Es ist spät, also ich gehe.", "correct": "Es ist spät, also gehe ich."}, {"title": "Starting a sentence", "explanation": "Also, … works like English 'So, …' or 'Well, …'.", "examples": [{"german": "Also, wo waren wir?", "english": "So, where were we?", "highlight": "Also,"}]}], "sampleSentences": [{"german": "Er hat keine Zeit, also kommt er nicht.", "english": "He has no time, so he isn't coming.", "highlight": ["also"]}, {"german": "Also, was möchtest du trinken?", "english": "So, what would you like to drink?", "highlight": ["Also,"]}, {"german": "Ich komme auch mit.", "english": "I'm coming too.", "highlight": ["auch"]}, {"german": "Also gut, machen wir das so.", "english": "All right then, let's do it that way.", "highlight": ["Also"]}], "forms": [], "memoryHook": "Also = so. Auch = also. Swap them in your head.", "signOff": "Also, bis bald!", "quiz": [{"type": "choice", "prompt": "Ich trinke Tee, und meine Frau trinkt ___ Tee. (too)", "options": ["also", "auch"], "answer": "auch", "explanation": "Too, as well: auch.", "id": "q1"}, {"type": "choice", "prompt": "Der Laden ist zu, ___ gehen wir nach Hause. (so)", "options": ["also", "auch"], "answer": "also", "explanation": "Therefore: also.", "id": "q2"}, {"type": "choice", "prompt": "Which sentence is correct?", "options": ["Es ist spät, also ich gehe.", "Es ist spät, also gehe ich."], "answer": "Es ist spät, also gehe ich.", "explanation": "The verb comes right after also.", "id": "q3"}, {"type": "choice", "prompt": "German 'also' means…", "options": ["also, too", "so, therefore"], "answer": "so, therefore", "explanation": "A false friend.", "id": "q4"}, {"type": "fill-in-the-blank", "prompt": "Ich bin ___ Lehrerin. (I'm a teacher too.)", "answer": "auch", "fullAnswer": "Ich bin auch Lehrerin.", "explanation": "Too: auch.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "card", "word": {"headword": "alt", "partOfSpeech": "adjective", "pronunciation": {"respelling": "AHLT", "ipa": "alt", "notes": ""}, "meaning": "old", "shortDefinition": "Old."}, "tables": [{"title": "Old, older, oldest", "columns": ["form"], "rows": [{"label": "old", "cells": ["alt"]}, {"label": "older", "cells": ["|älter"]}, {"label": "oldest", "cells": ["am |ältesten"]}], "notes": ["The umlaut appears in the comparative: älter, not alter."]}], "wordFamily": [{"german": "das Alter", "english": "age", "type": "noun"}, {"german": "jung", "english": "young", "type": "adjective"}, {"german": "neu", "english": "new", "type": "adjective"}], "commonMistakes": [{"title": "Opposites", "explanation": "For people the opposite is jung; for things it's neu.", "examples": [{"german": "ein junger Mann", "english": "a young man", "highlight": "junger"}, {"german": "ein neues Auto", "english": "a new car", "highlight": "neues"}]}], "sampleSentences": [{"german": "Wie alt bist du? – Ich bin 25 Jahre alt.", "english": "How old are you? – I'm 25.", "highlight": ["alt", "alt."]}, {"german": "Mein Bruder ist älter als ich.", "english": "My brother is older than me.", "highlight": ["älter"]}, {"german": "Wir wohnen in einem alten Haus.", "english": "We live in an old house.", "highlight": ["alten"]}, {"german": "Das Alter spielt keine Rolle.", "english": "Age doesn't matter.", "highlight": ["Alter"]}], "forms": ["alte", "alten", "alter", "altes", "älter", "ältesten", "Alter"], "memoryHook": "Alt = old, like English 'old' and 'elder'. Älter has the umlaut, just as 'elder' changes its vowel.", "signOff": "Gut gemacht!", "quiz": [{"type": "fill-in-the-blank", "prompt": "Wie ___ sind Sie?", "answer": "alt", "fullAnswer": "Wie alt sind Sie?", "explanation": "Asking someone's age.", "id": "q1"}, {"type": "fill-in-the-blank", "prompt": "Meine Schwester ist ___ als ich. (older)", "answer": "älter", "fullAnswer": "Meine Schwester ist älter als ich.", "explanation": "Alt, älter, am ältesten.", "acceptedAnswers": ["aelter"], "id": "q2"}, {"type": "choice", "prompt": "Ich bin 30 ___ alt.", "options": ["Jahr", "Jahre"], "answer": "Jahre", "explanation": "Ages use the plural: 30 Jahre alt.", "id": "q3"}, {"type": "choice", "prompt": "The opposite of alt (for people) is…", "options": ["jung", "neu"], "answer": "jung", "explanation": "For people: jung. For things: neu.", "id": "q4"}, {"type": "choice", "prompt": "das ___ (age)", "options": ["Alt", "Alter", "Alte"], "answer": "Alter", "explanation": "The noun is das Alter.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "full", "word": {"headword": "an", "partOfSpeech": "preposition (dative or accusative); separable prefix", "pronunciation": {"respelling": "AHN", "ipa": "an", "notes": "Short a."}, "meaning": "at, on (a vertical surface or edge); on (days and dates)", "shortDefinition": "Says where something is next to or touching, and when something happens."}, "intro": {"title": "At the station, on Monday", "paragraphs": ["An covers a lot of what English does with 'at' and 'on': am Bahnhof (at the station), an der Wand (on the wall), am Montag (on Monday). It's also one of the most common verb prefixes: anrufen, ankommen, anfangen."]}, "etymology": {"title": "Where it comes from", "summary": "An is the same word as English 'on', and a close cousin of 'at' in many uses.", "cognates": [{"word": "on", "language": "English"}, {"word": "aan", "language": "Dutch"}]}, "tables": [{"title": "an + dem = am", "intro": "With masculine and neuter nouns in the dative, an and dem merge into am. You'll see am far more often than an dem.", "columns": ["where (dative)", "where to (accusative)"], "rows": [{"label": "masculine", "cells": ["a|m| Tisch", "an |den| Tisch"]}, {"label": "feminine", "cells": ["an |der| Wand", "an |die| Wand"]}, {"label": "neuter", "cells": ["a|m| Fenster", "an|s| Fenster"]}], "notes": ["Where something is: dative (am, an der). Where it's going: accusative (an den, an die, ans).", "Days, parts of the day and dates always use am: am Montag, am Abend, am 3. Mai."]}], "wordFamily": [{"german": "am Montag", "english": "on Monday", "type": "phrase"}, {"german": "am Abend", "english": "in the evening", "type": "phrase"}, {"german": "an sein", "english": "to be on (light, TV)", "type": "phrase"}, {"german": "anrufen, ankommen, anfangen", "english": "verbs with the prefix an-", "type": "separable verbs"}], "keyTrap": {"title": "The big trap: in, an or auf for days and places?", "explanation": "English says 'on Monday' and 'at the station'. German uses am for both, but in for months and seasons.", "wrong": {"german": "Ich komme an Montag.", "verdict": "Days need am, the short form of an dem."}, "correct": [{"german": "Ich komme am Montag.", "literal": "I come on-the Monday.", "note": "Days: am."}, {"german": "Wir treffen uns am Bahnhof.", "literal": "We meet at-the station.", "note": "At a place you stand next to: am."}, {"german": "Ich habe im Mai Urlaub.", "literal": "I have in-the May holiday.", "note": "Months: im, not am."}]}, "commonMistakes": [{"title": "an or auf?", "explanation": "An is for vertical surfaces and edges, auf for horizontal surfaces you can put things on.", "examples": [{"german": "Das Bild hängt an der Wand.", "english": "The picture is hanging on the wall.", "highlight": "an"}, {"german": "Das Buch liegt auf dem Tisch.", "english": "The book is on the table.", "highlight": "auf"}]}, {"title": "Near water", "explanation": "By the sea, a lake or a river is an: am Meer, am See, am Rhein.", "wrong": "Wir machen Urlaub bei dem Meer.", "correct": "Wir machen Urlaub am Meer."}], "sampleSentences": [{"german": "Fahren Sie an der nächsten Ampel rechts.", "english": "Turn right at the next traffic lights.", "highlight": ["an"]}, {"german": "Am Wochenende habe ich frei.", "english": "I'm off at the weekend.", "highlight": ["Am"]}, {"german": "Er sitzt am Fenster.", "english": "He's sitting by the window.", "highlight": ["am"]}, {"german": "Ich hänge das Foto an die Wand.", "english": "I'm hanging the photo on the wall.", "highlight": ["an", "die"]}, {"german": "Mach bitte das Licht an.", "english": "Please turn the light on.", "highlight": ["an."]}], "forms": ["am", "ans", "an dem", "an der"], "memoryHook": "An = on, at, next to. Days and places you stand at take am: am Montag, am Bahnhof.", "signOff": "Bis am Montag!", "quiz": [{"type": "choice", "prompt": "Ich habe ___ Freitag Zeit.", "options": ["an", "am", "im"], "answer": "am", "explanation": "Days: am.", "id": "q1"}, {"type": "choice", "prompt": "Wir fahren im Sommer ___ Meer.", "options": ["ans", "am"], "answer": "ans", "explanation": "Where to (moving): accusative, an + das = ans.", "id": "q2"}, {"type": "choice", "prompt": "Wir wohnen direkt ___ Meer.", "options": ["ans", "am"], "answer": "am", "explanation": "Where (location): dative, an + dem = am.", "id": "q3"}, {"type": "choice", "prompt": "Das Poster hängt ___ der Wand.", "options": ["an", "auf"], "answer": "an", "explanation": "A vertical surface: an.", "id": "q4"}, {"type": "fill-in-the-blank", "prompt": "Ich komme ___ 5. Juni. (on the 5th of June)", "answer": "am", "fullAnswer": "Ich komme am 5. Juni.", "explanation": "Dates use am.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "card", "word": {"headword": "an sein", "partOfSpeech": "verb phrase", "pronunciation": {"respelling": "AHN zine", "ipa": "an zaɪn", "notes": ""}, "meaning": "to be on (lights, machines)", "shortDefinition": "To be on (lights, machines)."}, "wordFamily": [{"german": "aus sein", "english": "to be off; to be over", , {"type": "choice", "prompt": "___ Angebot", "options": ["der", "die", "das"], "answer": "das", "explanation": "Das Angebot, plural die Angebote.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "card", "word": {"headword": "ander-", "partOfSpeech": "adjective (always with an ending: andere, anderer, anderes)", "pronunciation": {"respelling": "AHN-der-uh", "ipa": "ˈandəʁə", "notes": ""}, "meaning": "other, different", "shortDefinition": "Other, different."}, "etymology": {"title": "Where it comes from", "summary": "Ander- and English 'other' come from the same old Germanic word.", "cognates": [{"word": "other", "language": "English"}, {"word": "ander", "language": "Dutch"}]}, "commonMistakes": [{"title": "Always with an ending", "explanation": "The bare form ander is never used on its own.", "wrong": "die ander Jacke", "correct": "die andere Jacke"}], "sampleSentences": [{"german": "Ich möchte die andere Jacke.", "english": "I'd like the other jacket.", "highlight": ["andere"]}, {"german": "Haben Sie das auch in einer anderen Farbe?", "english": "Do you have it in a different colour too?", "highlight": ["anderen"]}, {"german": "Das ist etwas ganz anderes.", "english": "That's something completely different.", "highlight": ["anderes."]}, {"german": "Die anderen kommen später.", "english": "The others are coming later.", "highlight": ["anderen"]}], "forms": ["andere", "anderer", "anderes", "anderen", "anderem"], "memoryHook": "Ander- is English 'other' with an n. It never stands bare: it always has an ending, like andere, anderes, anderen.", "signOff": "Gut gemacht!", "quiz": [{"type": "choice", "prompt": "Ich nehme die ___ Tasche. (the other bag)", "options": ["andere", "anderen", "anderer"], "answer": "andere", "explanation": "Die + feminine: andere.", "id": "q1"}, {"type": "choice", "prompt": "Das ist etwas ___. (something different)", "options": [ , "cells": ["fangen … |an", "haben … |angefangen"]}, {"label": "ihr", "cells": ["fangt … |an", "habt … |angefangen"]}, {"label": "sie, Sie", "cells": ["fangen … |an", "haben … |angefangen"]}], "notes": ["Du fängst and er fängt get an umlaut."]}], "wordFamily": [{"german": "der Anfang", "english": "beginning", "type": "noun"}, {"german": "beginnen", "english": "to begin (a bit more formal)", "type": "verb"}, {"german": "aufhören", "english": "to stop", "type": "separable verb"}], "keyTrap": {"title": "The big trap: starting with something", "explanation": "To say what you're starting, German often uses mit + dative.", "wrong": {"german": "Ich anfange um acht mit der Arbeit.", "verdict": "The an has to go to the end."}, "correct": [{"german": "Ich fange um acht mit der Arbeit an.", "literal": "I catch at eight with the work on.", "note": "Starting an activity: mit + dative."}, {"german": "Der Kurs fängt am Montag an.", "literal": "The course catches on Monday on.", "note": "Something starts: no object."}]}, "commonMistakes": [{"title": "Don't forget the umlaut", "explanation": "For du and er, sie, es: fängst, fängt.", "wrong": "Er fangt an.", "correct": "Er fängt an."}, {"title": "Beginning of a month", "explanation": "Anfang + month, without a preposition.", "examples": [{"german": "Anfang Mai fahre ich weg.", "english": "I'm going away at the beginning of May.", "highlight": "Anfang"}]}], "sampleSentences": [{"german": "Wann fängt der Film an?", "english": "When does the film start?", "highlight": ["fängt", "an?"]}, {"german": "Der Unterricht fängt gleich an.", "english": "The lesson is about to start.", "highlight": ["fängt", "an."]}, {"german": "Ich habe mit dem Sport angefangen.", "english": "I've started doing sport.", "highlight": ["angefangen."]}, {"german": "Am Anfang war alles neu.", "english": "At the beginning everything was new.", "highlight": ["Anfang"]}], "forms": ["fange an", "fängst an", "fängt an", "angefangen", "fing an", "Anfang"], "memoryHook": "A , "an."]}, {"german": "Du musst dieses Feld anklicken.", "english": "You have to click this box.", "highlight": ["anklicken."]}, {"german": "Ich habe den Link angeklickt.", "english": "I clicked the link.", "highlight": ["angeklickt."]}], "forms": ["klicke an", "klickt an", "angeklickt"], "memoryHook": "Anklicken is English 'click' with an an-: you click on something.", "signOff": "Gut gemacht!", "quiz": [{"type": "fill-in-the-blank", "prompt": "Bitte ___ Sie das Bild an.", "answer": "klicken", "fullAnswer": "Bitte klicken Sie das Bild an.", "explanation": "Klicken first, an at the end.", "id": "q1"}, {"type": "fill-in-the-blank", "prompt": "Hast du den Button ___?", "answer": "angeklickt", "fullAnswer": "Hast du den Button angeklickt?", "explanation": "An-ge-klickt.", "id": "q2"}, {"type": "choice", "prompt": "Which sentence is correct?", "options": ["Ich anklicke den Link.", "Ich klicke den Link an."], "answer": "Ich klicke den Link an.", "explanation": "An goes to the end.", "id": "q3"}, {"type": "choice", "prompt": "Du musst hier ___.", "options": ["anklicken", "klicken an"], "answer": "anklicken", "explanation": "After musst, the verb stays whole.", "id": "q4"}, {"type": "choice", "prompt": "Anklicken is used for…", "options": ["computers and phones", "doors"], "answer": "computers and phones", "explanation": "Clicking on screens.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "card", "word": {"headword": "ankreuzen", "partOfSpeech": "separable verb", "pronunciation": {"respelling": "AHN-kroy-tsen", "ipa": "ˈankʁɔɪ̯tsn̩", "notes": "Eu sounds like 'oy' in 'boy'."}, "meaning": "to tick, to mark with a cross", "shortDefinition": "To tick, to mark with a cross."}, "wordFamily": [{"german": "das Kreuz", "english": "cross", "type": "noun"}], "sampleSentences": [{"german": "Bitte kreuzen Sie die richtige Antwort an.", "english": "Please tick the right answer.", "highlight": ["kreuzen", "an."]}, {"german": "Hier musst du 'ja' oder 'nein' ankreuzen.", "english": "Here you have to tick 'yes' or 'no'.", "highlight": ["ankreuzen."]}, {"german": "Ich habe das falsche Feld angekreuzt.", "english": "I ticked the wrong box.", "highlight": ["angekreuzt."]}], "forms": ["kreuze an", "kreuzt an", "angekreuzt"], "memoryHook": "Ankreuzen = put a Kreuz (cross) on it. On German forms you mark boxes with an X.", "signOff": "Gut gemacht!", "quiz": [{"type": "fill-in-the-blank", "prompt": "Bitte ___ Sie die richtige Antwort an.", "answer": "kreuzen", "fullAnswer": "Bitte kreuzen Sie die richtige Antwort an.", "explanation": "Kreuzen first, an at the end.", "id": "q1"}, {"type": "fill-in-the-blank", "prompt": "Ich habe 'nein' ___.", "answer": "angekreuzt", "fullAnswer": "Ich habe 'nein' angekreuzt.", "explanation": "An-ge-kreuzt.", "id": "q2"}, {"type": "choice", "prompt": "Ankreuzen comes from das Kreuz, which means…", "options": ["cross", "circle", "line"], "answer": "cross", "explanation": "German forms are often marked with a cross (X).", "id": "q3"}, {"type": "choice", "prompt": "In a German exam you see 'Kreuzen Sie an'. You should…", "options": ["mark the box", "write a sentence"], "answer": "mark the box", "explanation": "Ankreuzen: mark with a cross.", "id": "q4"}, {"type": "choice", "prompt": "The eu in kreuzen sounds like…", "options": ["oy in 'boy'", "oo in 'food'"], "answer": "oy in 'boy'", "explanation": "Eu is always 'oy'.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "word": {"headword": "Ankunft", "partOfSpeech": "noun, feminine (die Ankunft)", "pronunciation": {"respelling": "AHN-koonft", "ipa": "ˈankʊnft", "notes": "Stress the An. The u is short, like the u in 'put'. In the plural, Ankünfte, it becomes ü: AHN-kuenf-tuh."}, "meaning": "arrival", "shortDefinition": "The moment someone or something gets to where it was going."}, "intro": {"title": "Let's start at the airport", "paragraphs": ["You've just landed in Frankfurt after a twelve-hour flight. You're tired, you're looking for your bag, and you follow the big yellow signs. One of them says Ankunft. That's where you are: arrivals.", "Ankunft is the German word for arrival. You'll see it on every airport sign, every train timetable and every hotel booking. You'll need it from your very first day in a German-speaking country."]}, "etymology": {"title": "Where it comes from", "parts": [{"part": "an", "meaning": "at, onto, toward", "note": "The same an as in am Bahnhof (at the station)."}, {"part": "-kunft", "meaning": "a coming", "note": "An old noun made from kommen (to come). It survives only inside compound words.", "emphasis": "arrive"}], "literalMeaning": "a coming-to", "summary": "An arrival is the moment you come to a place.", "bonus": {"word": "Zukunft", "meaning": "the future", "literalMeaning": "a coming-toward", "note": "Zu means toward. The future is whatever is coming toward you. Once you know -kunft, a whole group of words opens up: see the family below."}}, "wordFamily": [{"german": "ankommen", "english": "to arrive", "literal": "to come at", "type": "separable verb"}, {"german": "die Ankunftszeit", "english": "arrival time", "type": "noun"}, {"german": "die Ankunftshalle", "english": "arrivals hall", "type": "noun"}, {"german": "die Zukunft", "english": "the future", "literal": "a coming-toward", "type": "noun"}, {"german": "die Herkunft", "english": "origin, background", "literal": "a coming-from", "type": "noun"}, {"german": "die Unterkunft", "english": "accommodation, a place to stay", "literal": "a coming-under (a roof)", "type": "noun"}, {"german": "die Auskunft", "english": "information, an information desk", "literal": "what comes out", "type": "noun"}], "keyTrap": {"title": "The big trap: the verb splits in two", "explanation": "The noun Ankunft stays in one piece, but its verb ankommen is a separable verb. In a normal sentence the an breaks off and moves to the very end. English speakers glue it back together all the time.", "wrong": {"german": "Ich ankomme um acht Uhr.", "verdict": "Not German. The an has to go to the end."}, "correct": [{"german": "Ich komme um acht Uhr an.", "literal": "I come at eight o'clock at.", "note": "The present tense: kommen in second place, an at the end."}, {"german": "Wir sind gut angekommen.", "literal": "We are well arrived.", "note": "The past tense: the ge slips in between, giving angekommen."}, {"german": "Meine Ankunft ist um acht Uhr.", "literal": "My arrival is at eight o'clock.", "note": "Or skip the verb and use the noun. It never splits."}]}, "commonMistakes": [{"title": "The gender", "explanation": "Ankunft is feminine. Here's a free rule: every noun ending in -kunft is feminine, so die Zukunft, die Herkunft and die Unterkunft too.", "wrong": "der Ankunft", "correct": "die Ankunft"}, {"title": "The plural", "explanation": "The plural adds -e and an umlaut. You'll see it on departure boards that list several trains at once.", "forms": [{"label": "One", "value": "die Ankunft"}, {"label": "More than one", "value": "die Ankünfte"}, {"label": "On a station board", "value": "Ankünfte und Abfahrten"}]}, {"title": "The linking s in compounds", "explanation": "When Ankunft starts a longer word, German adds an s to join the parts. It's called the Fugen-s, and -kunft always takes it.", "wrong": "die Ankunftzeit", "correct": "die Ankunftszeit"}, {"title": "The preposition after it", "explanation": "You arrive in a city and at a place, so it's in or an, never nach. Nach is for travelling toward somewhere, not for getting there.", "examples": [{"german": "die Ankunft in Berlin", "english": "the arrival in Berlin", "highlight": "in"}, {"german": "die Ankunft am Flughafen", "english": "the arrival at the airport", "highlight": "am"}, {"german": "bei der Ankunft", "english": "on arrival", "highlight": "bei"}]}], "sampleSentences": [{"german": "Die Ankunft des Zuges verzögert sich um zehn Minuten.", "english": "The train's arrival is delayed by ten minutes."}, {"german": "Bei der Ankunft im Hotel bekommen Sie Ihren Schlüssel.", "english": "You'll get your key when you arrive at the hotel."}, {"german": "Wann kommst du in Hamburg an?", "english": "When do you arrive in Hamburg?", "highlight": ["kommst", "an"]}, {"german": "Schick mir bitte nach deiner Ankunft eine Nachricht.", "english": "Please send me a message after you arrive."}, {"german": "Auf der Anzeigetafel stehen alle Ankünfte und Abfahrten.", "english": "The board shows all arrivals and departures.", "highlight": ["Ankünfte"]}, {"german": "Wir sind gut angekommen!", "english": "We arrived safely!", "highlight": ["angekommen"]}, {"german": "Es kommt darauf an, wie das Wetter wird.", "english": "It depends on what the weather does. (Bonus phrase: ankommen auf means “to depend on.”)", "highlight": ["kommt", "an"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Der Zug kommt um neun Uhr ___.", "answer": "an", "fullAnswer": "Der Zug kommt um neun Uhr an.", "explanation": "Ankommen is separable, so an moves to the end of the sentence."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "eine Ankunft, zwei ___", "answer": "Ankünfte", "acceptedAnswers": ["Ankünfte", "Ankuenfte"], "fullAnswer": "eine Ankunft, zwei Ankünfte", "explanation": "The plural adds -e and an umlaut. If your keyboard has no ü, write ue."}, {"id": "q3", "type": "fill-in-the-blank", "prompt": "___ Ankunft ist um acht Uhr. (der, die or das?)", "answer": "Die", "fullAnswer": "Die Ankunft ist um acht Uhr.", "explanation": "Every noun ending in -kunft is feminine."}, {"id": "q4", "type": "fill-in-the-blank", "prompt": "die Ankunft___zeit", "answer": "s", "acceptedAnswers": ["Ankunftszeit", "die Ankunftszeit"], "fullAnswer": "die Ankunftszeit", "explanation": "When Ankunft starts a compound, it takes the linking s."}, {"id": "q5", "type": "fill-in-the-blank", "prompt": "Wann ist deine Ankunft ___ Berlin?", "answer": s: Sehr geehrte Frau …, Sehr geehrter Herr … . Friends: Liebe …, Lieber … .", "examples": [{"german": "Sehr geehrter Herr Klein,", "english": "Dear Mr Klein,", "highlight": "geehrter"}, {"german": "Liebe Maria,", "english": "Dear Maria,", "highlight": "Liebe"}]}], "sampleSentences": [{"german": "Vergessen Sie die Anrede nicht.", "english": "Don't forget the greeting.", "highlight": ["Anrede"]}, {"german": "Im Brief steht als Anrede: Sehr geehrte Frau Weber.", "english": "The letter opens: Dear Ms Weber.", "highlight": ["Anrede:"]}, {"german": "Mit Freunden ist die Anrede einfach: Liebe Anna.", "english": "With friends the greeting is simple: Dear Anna.", "highlight": ["Anrede"]}], "forms": ["Anreden"], "memoryHook": "Anrede = what you an-reden someone with: the words you address them with.", "signOff": "Gut gemacht!", "quiz": [{"type": "choice", "prompt": "___ Anrede", "options": ["der", "die", "das"], "answer": "die", "explanation": "Anrede is feminine.", "id": "q1"}, {"type": "fill-in-the-blank", "prompt": "ein Anrede, zwei ___", "answer": "Anreden", "fullAnswer": "ein Anrede, zwei Anreden", "explanation": "The plural is Anreden.", "acceptedAnswers": ["Anreden"], "id": "q2"}, {"type": "choice", "prompt": "A formal letter to Frau Weber begins:", "options": ["Sehr geehrte Frau Weber,", "Hallo Weber,"], "answer": "Sehr geehrte Frau Weber,", "explanation": "Formal: Sehr geehrte/r.", "id": "q3"}, {"type": "choice", "prompt": "An email to your friend Tom begins:", "options": ["Lieber Tom,", "Liebe Tom,"], "answer": "Lieber Tom,", "explanation": "Masculine: Lieber. Feminine: Liebe.", "id": "q4"}, {"type": "choice", "prompt": "For a stranger or your boss, the usual Anrede is…", "options": ["du", "Sie"], "answer": "Sie", "explanation": "Sie is the formal 'you'.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "full", "word": {"headword": "anrufen", "partOfSpeech": "separable verb", "pronunciation": {"respelling": "AHN-roo-fen", "ipa": "ˈanˌʁuːfn̩", "notes": "Stress the an. The u is long, like the oo in 'food'."}, "meaning": "to call (on the phone)", "shortDefinition": "To phone someone."}, "intro": {"title": "Ring ring", "paragraphs": ["Your landlord's note says: Bitte rufen Sie mich an. You recognise rufen, and there's an an floating at the end of the sentence. Put them together and you get anrufen: please call me.", "Anrufen is one of the first separable verbs most learners meet. Once it clicks, hundreds of other verbs follow the same rule."]}, "etymology": {"title": "Where it comes from", "parts": [{"part": "an", "meaning": "at, toward", "note": "The same an as in Ankunft."}, {"part": "rufen", "meaning": "to call out, to shout", "note": "Related to the old English word 'roop', a hoarse shout."}], "literalMeaning": "to call toward", "summary": "Long before phones, anrufen meant calling out to someone. The telephone just took over the word.", "bonus": {"word": "der Anruf", "meaning": "a phone call", "literalMeaning": "a call toward", "note": "Drop the -en and you get the noun. Der Anrufbeantworter, literally 'call answerer', is an answering machine."}}, "tables": [{"title": "How it splits", "intro": "In the present tense the an breaks off and goes to the end of the sentence. In the past it comes back, with ge squeezed in the middle.", "columns": ["present tense", "past (Perfekt)"], "rows": [{"label": "ich", "cells": ["rufe … |an", "habe … |angerufen"]}, {"label": "du", "cells": ["rufst … |an", "hast … |angerufen"]}, {"label": "er, sie, es", "cells": ["ruft … |an", "hat … |angerufen"]}, {"label": "wir", "cells": ["rufen … |an", "haben … |angerufen"]}, {"label": "ihr", "cells": ["ruft … |an", "habt … |angerufen"]}, {"label": "sie, Sie", "cells": ["rufen … |an", "haben … |angerufen"]}], "notes": ["The … is where the rest of the sentence goes: Ich rufe dich morgen an.", "In the infinitive and after a modal verb it stays in one piece: Ich muss dich anrufen."]}], "wordFamily": [{"german": "der Anruf", "english": "phone call", "type": "noun"}, {"german": "der Anrufbeantworter", "english": "answering machine", "literal": "call answerer", "type": "noun"}, {"german": "zurückrufen", "english": "to call back", "type": "separable verb"}, {"german": "rufen", "english": "to call out, to shout", "type": "verb"}, {"german": "telefonieren", "english": "to talk on the phone", "type": "verb"}], "keyTrap": {"title": "The big trap: keeping it in one piece", "explanation": "In a normal sentence, anrufen splits. The rufen part takes second place and the an goes to the very end.", "wrong": {"german": "Ich anrufe dich morgen.", "verdict": "The an has to go to the end."}, "correct": [{"german": "Ich rufe dich morgen an.", "literal": "I call you tomorrow at.", "note": "Present tense: split."}, {"german": "Ich habe dich gestern angerufen.", "literal": "I have you yesterday at-called.", "note": "Past: one word again, with ge in the middle."}, {"german": "Ich will dich morgen anrufen.", "literal": "I want you tomorrow to call.", "note": "After will, kann, muss: one word at the end."}]}, "commonMistakes": [{"title": "dich, not dir", "explanation": "You call someone directly, so the person is in the accusative: mich, dich, ihn, Sie.", "wrong": "Ich rufe dir an.", "correct": "Ich rufe dich an."}, {"title": "Calling a place", "explanation": "To call a company, office or shop, use bei with the dative.", "wrong": "Ich rufe die Bank an.", "correct": "Ich rufe bei der Bank an."}, {"title": "The past participle", "explanation": "The ge goes between the two parts, never in front.", "wrong": "geanrufen", "correct": "angerufen"}], "sampleSentences": [{"german": "Rufen Sie mich bitte morgen an.", "english": "Please call me tomorrow.", "highlight": ["Rufen", "an"]}, {"german": "Wann kann ich Sie erreichen? Ich rufe nach dem Mittagessen an.", "english": "When can I reach you? I'll call after lunch.", "highlight": ["rufe", "an"]}, {"german": "Meine Mutter hat dreimal angerufen.", "english": "My mother called three times.", "highlight": ["angerufen"]}, {"german": "Ich muss noch beim Arzt anrufen.", "english": "I still have to call the doctor's office.", "highlight": ["anrufen"]}, {"german": "Danke für deinen Anruf!", "english": "Thanks for your call!", "highlight": ["Anruf!"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Ich ___ dich heute Abend an.", "answer": "rufe", "fullAnswer": "Ich rufe dich heute Abend an.", "explanation": "The verb part takes second place; an goes to the end."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "Kannst du ___ später anrufen? (me)", "answer": "mich", "fullAnswer": "Kannst du mich später anrufen?", "explanation": "Anrufen takes the accusative: mich, not mir."}, {"id": "q3", "type": "fill-in-the-blank", "prompt": "Er hat gestern nicht ___. (anrufen)", "answer": "angerufen", "fullAnswer": "Er hat gestern nicht angerufen.", "explanation": "The ge goes in the middle: an-ge-rufen."}, {"id": "q4", "type": "open", "prompt": "How do you say \"I'll call you back\"?", "acceptedAnswers": ["Ich rufe dich zurück.", "Ich rufe Sie zurück."], "explanation": "Zurückrufen splits the same way as anrufen."}, {"type": "choice", "prompt": "Which sentence is correct?", "options": ["Ich anrufe dich morgen.", "Ich rufe dich morgen an.", "Ich rufe an dich morgen."], "answer": "Ich rufe dich morgen an.", "explanation": "Rufe in second place, an at the end.", "id": "q5"}], "forms": ["rufe an", "rufst an", "ruft an", "rufen an", "angerufen", "rief an", "der Anruf"], "memoryHook": "Anrufen is a phone call that hangs up early: the an always runs to the end. Ich rufe dich an.", "signOff": "Bis später!", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "card", "word": {"headword": "Ansage", "partOfSpeech": "noun, feminine (die Ansage)", "pronunciation": {"re
