erman": "Ich habe morgen einen Termin beim Arzt.", "english": "I have a doctor's appointment tomorrow.", "highlight": ["Arzt."]}, {"german": "Meine Ärztin ist sehr nett.", "english": "My (female) doctor is very nice.", "highlight": ["Ärztin"]}, {"german": "Du bist krank. Geh zum Arzt!", "english": "You're ill. Go to the doctor!", "highlight": ["Arzt!"]}], "forms": ["Ärzte", "Ärztin", "Ärztinnen"], "memoryHook": "Zum Arzt gehen (go to), beim Arzt sein (be at). Women are Ärztinnen.", "signOff": "Gut gemacht!", "quiz": [{"type": "choice", "prompt": "___ Arzt", "options": ["der", "die", "das"], "answer": "der", "explanation": "Arzt is masculine.", "id": "q1"}, {"type": "fill-in-the-blank", "prompt": "ein Arzt, zwei ___", "answer": "Ärzte", "fullAnswer": "ein Arzt, zwei Ärzte", "explanation": "The plural is Ärzte.", "acceptedAnswers": ["Ärzte"], "id": "q2"}, {"type": "choice", "prompt": "A female doctor is…", "options": ["die Ärztin", "die Arztin"], "answer": "die Ärztin", "explanation": "The feminine has an umlaut: Ärztin.", "id": "q3"}, {"type": "choice", "prompt": "Ich gehe ___ Arzt.", "options": ["zum", "beim"], "answer": "zum", "explanation": "Going to: zum Arzt.", "id": "q4"}, {"type": "choice", "prompt": "Ich bin ___ Arzt. (at the doctor's)", "options": ["zum", "beim"], "answer": "beim", "explanation": "Being there: beim Arzt.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "full", "word": {"headword": "auch", "partOfSpeech": "adverb", "pronunciation": {"respelling": "OWKH", "ipa": "aʊ̯x", "notes": "Au as in 'how', then the throaty ch of Scottish 'loch'."}, "meaning": "also, too, as well", "shortDefinition": "Adds something or someone to what's already been said."}, "intro": {"title": "Me too!", "paragraphs": ["Auch is the German 'also' or 'too'. Ich auch! is 'Me too!'. Remember that German also means 'so', so when you mean 'also', reach for auch."]}, "wordFamily": [{"german": "ich auch", "english": "me too", "type": "phrase"}, {"german": "ich auch nicht", "english": "me neither", "type": "phrase"}, {"german": "also", "english": "so, therefore", "type": "adverb"}], "keyTrap": {"title": "The big trap: me too or me neither?", "explanation": "If the first sentence is negative, you need auch nicht.", "wrong": {"german": "Ich trinke keinen Alkohol. – Ich auch.", "verdict": "Agreeing with a negative needs auch nicht."}, "correct": [{"german": "Ich trinke keinen Alkohol. – Ich auch nicht.", "literal": "Me also not.", "note": "Me neither: ich auch nicht."}, {"german": "Ich trinke gern Tee. – Ich auch.", "literal": "Me also.", "note": "Me too: ich auch."}]}, "commonMistakes": [{"title": "Position", "explanation": "Auch goes right before the part it adds to, usually after the verb.", "wrong": "Auch ich spreche Englisch auch.", "correct": "Ich spreche auch Englisch."}, {"title": "auch vs also", "explanation": "German also means 'so'.", "wrong": "Ich komme also.", "correct": "Ich komme auch."}], "sampleSentences": [{"german": "Ich bin auch Spanierin.", "english": "I'm Spanish too.", "highlight": ["auch"]}, {"german": "Kommst du auch mit?", "english": "Are you coming along too?", "highlight": ["auch"]}, {"german": "Ich habe keine Zeit. – Ich auch nicht.", "english": "I don't have time. – Me neither.", "highlight": ["auch", "nicht."]}, {"german": "Das ist auch schön.", "english": "That's nice too.", "highlight": ["auch"]}], "forms": ["auch nicht"], "memoryHook": "Auch = also, too. Ich auch = me too. Ich auch nicht = me neither.", "signOff": "Dir auch einen schönen Tag!", "quiz": [{"type": "choice", "prompt": "Ich liebe Pizza. – ___!", "options": ["Ich auch", "Ich auch nicht"], "answer": "Ich auch", "explanation": "Agreeing with a positive.", "id": "q1"}, {"type": "choice", "prompt": "Ich mag keinen Fisch. – ___!", "options": ["Ich auch", "Ich auch nicht"], "answer": "Ich auch nicht", "explanation": "Agreeing with a negative.", "id": "q2"}, {"type": "choice", "prompt": "Er spricht Deutsch und ___ Englisch. (also)", "options": ["also", "auch"], "answer": "auch", "explanation": "Also, too: auch.", "id": "q3"}, {"type": "fill-in-the-blank", "prompt": "Ich habe Hunger. – Ich ___! (me too)", "answer": "auch", "fullAnswer": "Ich auch!", "explanation": "Ich auch: me too.", "id": "q4"}, {"type": "choice", "prompt": "Which sentence is correct?", "options": ["Ich spreche auch Französisch.", "Ich auch spreche Französisch."], "answer": "Ich spreche auch Französisch.", "explanation": "The verb stays in second place.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "levelSource": "Goethe-Zertifikat A1 Wortliste", "lessonType": "full", "word": {"headword": "auf", "partOfSpeech": "preposition (dative or accusative); separable prefix", "pronunciation": {"respelling": "OWF", "ipa": "aʊ̯f", "notes": "Au as in 'how'."}, "meaning": "on (a horizontal surface); open; in (a language)", "shortDefinition": "On top of something, and in many fixed phrases."}, "intro": {"title": "On the table, in German, goodbye", "paragraphs": ["Auf means 'on top of': auf dem Tisch. But it turns up in phrases where English uses other words: auf Deutsch (in German), Auf Wiedersehen (goodbye), and as a prefix in aufstehen and aufhören."]}, "etymology": {"title": "Where it comes from", "summary": "Auf is related to English 'up'. Many auf- verbs still have an 'up' feeling: aufstehen, to stand up.", "cognates": [{"word": "up", "language": "English"}, {"word": "op", "language": "Dutch"}]}, "tables": [{"title": "Where or where to?", "columns": ["where (dative)", "where to (accusative)"], "rows": [{"label": "masculine", "cells": ["auf |dem| Tisch", "auf |den| Tisch"]}, {"label": "feminine", "cells": ["auf |der| Straße", "auf |die| Straße"]}, {"label": "neuter", "cells": ["auf |dem| Sofa", "auf|s| Sofa"]}], "notes": ["Where something is: dative. Where you put it or where it goes: accusative.", "Auf + das often shortens to aufs."]}], "wordFamily": [{"german": "Auf Wiedersehen!", "english": "Goodbye!", "type": "phrase"}, {"german": "auf Deutsch", "english": "in German", "type": "phrase"}, {"german": "auf sein", "english": "to be open", "type": "phrase"}, {"german": "aufstehen, aufhören", "english": "to get up, to stop", "type": "separable verbs"}], "keyTrap": {"title": "The big trap: in German = auf Deutsch", "explanation": "For languages, German uses auf, not in.", "wrong": {"german": "Wie heißt das in Deutsch?", "verdict": "Languages take auf."}, "correct": [{"german": "Wie heißt das auf Deutsch?", "literal": "How is that called on German?", "note": "Languages: auf."}, {"german": "Der Brief ist auf Englisch.", "literal": "The letter is on English.", "note": "Same rule."}]}, "commonMistakes": [{"title": "auf or an?", "explanation": "Auf is for horizontal surfaces, an for vertical ones.", "examples": [{"german": "Die Tasse steht auf dem Tisch.", "english": "The cup is on the table.", "highlight": "auf"}, {"german": "Die Uhr hängt an der Wand.", "english": "The clock is on the wall.", "highlight": "an"}]}, {"title": "Open", "explanation": "Auf sein means 'to be open' in everyday speech.", "wrong": "Die Tür ist offen auf.", "correct": "Die Tür ist auf."}], "sampleSentences": [{"german": "Die Kinder spielen auf der Straße.", "english": "The children are playing in the street.", "highlight": ["auf"]}, {"german": "Leg das Buch bitte auf den Tisch.", "english": "Put the book on the table, please.", "highlight": ["auf", "den"]}, {"german": "Wie sagt man das auf Deutsch?", "english": "How do you say that in German?", "highlight": ["auf"]}, {"german": "Auf Wiedersehen und bis morgen!", "english": "Goodbye and see you tomorrow!", "highlight": ["Auf"]}, {"german": "Ist die Apotheke noch auf?", "english": "Is the pharmacy still open?", "highlight": ["auf?"]}], "forms": ["aufs", "auf dem", "auf den", "auf der"], "memoryHook": "Auf = up and on. On the table, on German (auf Deutsch), up out of bed (aufstehen).", "signOff": "Auf Wiedersehen!", "quiz": [{"type": "choice", "prompt": "Das Handy liegt ___ dem Tisch.", "options": ["an", "auf"], "answer": "auf", "explanation": "A horizontal surface: auf.", "id": "q1"}, {"type": "choice", "prompt": "Wie heißt das ___ Deutsch?", "options": ["in", "auf"], "answer": "auf", "explanation": "Languages: auf.", "id": "q2"}, {"type": "choice", "prompt": "Ich lege das Buch auf ___ Tisch. (putting it there)", "options": ["dem", "den"], "answer": "den", "explanation": "Where to: accusative, den.", "id": "q3"}, {"type": "fill-in-the-blank", "prompt": "___ Wiedersehen! (Goodbye)", "answer": "Auf", "fullAnswer": "Auf Wiedersehen!", "explanation": "Auf Wiedersehen: until we see each other again.", "id": "q4"}, {"type": "choice", "prompt": "Der Supermarkt ist bis 22 Uhr ___. (open)", "options": ["auf", "an"], "answer": "auf", "explanation": "Open: auf sein.", "id": "q5"}]}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "full", "word": {"headword": "bekommen", "partOfSpeech": "verb", "pronunciation": {"respelling": "buh-KOM-en", "ipa": "bəˈkɔmən", "notes": "The be is short and unstressed, like the 'a' in 'about'. Stress kom."}, "meaning": "to get, to receive", "shortDefinition": "To get something that comes to you."}, "intro": {"title": "The word that looks like 'become'", "paragraphs": ["A tourist in a Berlin café says to the waiter: Ich bekomme ein Steak. He means 'I'll have a steak'. If he were thinking in English, it would sound like 'I become a steak.'", "Bekommen looks almost exactly like the English word 'become', but it means 'get' or 'receive'. It's the most famous false friend in German, and you'll use it every day."]}, "etymology": {"title": "Where it comes from", "parts": [{"part": "be-", "meaning": "a prefix that points at a target", "note": "It doesn't add much meaning on its own."}, {"part": "kommen", "meaning": "to come", "note": "The same kommen as in ankommen."}], "literalMeaning": "to come to", "summary": "Originally both words meant 'to come to, to reach'. In German, the meaning became 'something comes to you', so you get it. In English, 'become' drifted toward 'come to be'.", "bonus": {"word": "werden", "meaning": "to become", "note": "This is the German word you actually want for 'become': Ich werde müde, I'm getting tired."}}, "tables": [{"title": "Present tense", "intro": "Bekommen follows kommen, so it's regular in the present.", "columns": ["present", "past (Perfekt)"], "rows": [{"label": "ich", "cells": ["bekomm|e", "habe bekommen"]}, {"label": "du", "cells": ["bekomm|st", "hast bekommen"]}, {"label": "er, sie, es", "cells": ["bekomm|t", "hat bekommen"]}, {"label": "wir", "cells": ["bekomm|en", "haben bekommen"]}, {"label": "ihr", "cells": ["bekomm|t", "habt bekommen"]}, {"label": "sie, Sie", "cells": ["bekomm|en", "haben bekommen"]}], "notes": ["The past participle is bekommen, with no ge-. Verbs starting with be- never add ge."]}], "wordFamily": [{"german": "kommen", "english": "to come", "type": "verb"}, {"german": "werden", "english": "to become", "type": "verb"}, {"german": "kriegen", "english": "to get (casual)", "type": "verb"}, {"german": "erhalten", "english": "to receive (formal)", "type": "verb"}], "keyTrap": {"title": "The big trap: bekommen is not 'become'", "explanation": "When you mean 'become' or 'get' in the sense of changing, German uses werden. Bekommen is only for receiving something.", "wrong": {"german": "Ich bekomme müde.", "verdict": "This means nothing. You can't receive 'tired'."}, "correct": [{"german": "Ich werde müde.", "literal": "I become tired.", "note": "Changing state: werden."}, {"german": "Ich will Ärztin werden.", "literal": "I want doctor to become.", "note": "Becoming something: werden."}, {"german": "Ich habe deine Nachricht bekommen.", "literal": "I have your message received.", "note": "Receiving: bekommen."}]}, "commonMistakes": [{"title": "No ge- in the past", "explanation": "Verbs starting with be-, ge-, er-, ver- and zer- don't add ge in the Perfekt.", "wrong": "Ich habe es gebekommen.", "correct": "Ich habe es bekommen."}, {"title": "Ordering food", "explanation": "In a restaurant, bekommen is the polite way to order. Ich will sounds demanding.", "wrong": "Ich will einen Kaffee.", "correct": "Ich bekomme einen Kaffee, bitte."}, {"title": "Who gets what", "explanation": "From a waiter, 'Was bekommen Sie?' means 'What will you have?'. When you pay, 'Was bekommen Sie von mir?' means 'How much do I owe you?'.", "examples": [{"german": "Was bekommen Sie?", "english": "What will you have?", "highlight": "bekommen"}, {"german": "Was bekommen Sie von mir?", "english": "What do I owe you?", "highlight": "bekommen"}]}], "sampleSentences": [{"german": "Hast du meine E-Mail bekommen?", "english": "Did you get my email?", "highlight": ["bekommen?"]}, {"german": "Wir bekommen nächste Woche Besuch.", "english": "We're getting visitors next week.", "highlight": ["bekommen"]}, {"german": "Ich bekomme ein Glas Wasser, bitte.", "english": "I'll have a glass of water, please.", "highlight": ["bekomme"]}, {"german": "Das Medikament bekommen Sie in jeder Apotheke.", "english": "You can get the medicine at any pharmacy.", "highlight": ["bekommen"]}, {"german": "Sie bekommt ein Baby.", "english": "She's having a baby.", "highlight": ["bekommt"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Im Winter ___ es früh dunkel. (bekommen or werden?)", "answer": "wird", "fullAnswer": "Im Winter wird es früh dunkel.", "explanation": "Getting dark is a change of state, so it's werden."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "Ich habe dein Paket ___.", "answer": "bekommen", "fullAnswer": "Ich habe dein Paket bekommen.", "explanation": "Receiving, and no ge- in the past."}, {"id": "q3", "type": "open", "prompt": "You're in a café. How do you order a coffee politely?", "acceptedAnswers": ["Ich bekomme einen Kaffee, bitte."], "explanation": "Ich hätte gern einen Kaffee also works."}, {"type": "choice", "prompt": "Ich ___ Lehrerin. (I'm becoming a teacher.)", "options": ["bekomme", "werde"], "answer": "werde", "explanation": "Becoming is werden.", "id": "q4"}, {"type": "choice", "prompt": "What does Sie bekommt ein Baby mean?", "options": ["She's becoming a baby.", "She's having a baby."], "answer": "She's having a baby.", "explanation": "Bekommen means getting or receiving.", "id": "q5"}], "forms": ["bekomme", "bekommst", "bekommt", "bekam", "bekamen"], "memoryHook": "Bekommen is what comes to you. If you're changing, you werden. If something arrives, you bekommen.", "signOff": "Guten Appetit!", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "word": {"headword": "ein", "partOfSpeech": "indefinite article, and the number one", "cycle": ["ein", "eine", "einen", "einem", "einer", "eines", "ein"], "pronunciation": {"respelling": "AYN", "ipa": "aɪn", "notes": "It rhymes with English 'mine'. In German, ei always sounds like the English word 'eye'."}, "meaning": "a, an; one", "shortDefinition": "The German word for 'a', which is also the number one."}, "intro": {"title": "The smallest word with the most faces", "paragraphs": ["You learned ein on your first day of German. It's three letters long and means 'a'. Easy, right?", "Then you find out it has six different forms, that it also means 'one', and that sometimes German leaves it out where English insists on it. Ein causes more everyday mistakes than almost any other word, so it deserves a proper lesson."]}, "etymology": {"title": "Where it comes from", "summary": "Ein goes back to the old Germanic word for 'one'. English has the same word twice: it became 'one', and a worn-down, unstressed version became 'an' and then 'a'. German never split them, so ein still does both jobs.", "cognates": [{"word": "one", "language": "English", "note": "the number"}, {"word": "a, an", "language": "English", "note": "the article, a worn-down 'one'"}, {"word": "een", "language": "Dutch", "note": "article and number"}, {"word": "un, une", "language": "French", "note": "a more distant cousin, from Latin unus"}], "bonus": {"word": "allein", "meaning": "alone", "literalMeaning": "all one", "note": "English 'alone' was built the same way, from 'all one'. And kein comes from an old phrase meaning 'not one'."}}, "tables": [{"title": "Six forms, one pattern", "intro": "Ein changes its ending depending on the noun's gender and its job in the sentence (its case). The highlighted endings are what you need to learn.", "columns": ["masculine (der Hund)", "feminine (die Katze)", "neuter (das Kind)"], "rows": [{"label": "Nominative", "hint": "the subject", "cells": ["ein", "ein|e", "ein"]}, {"label": "Accusative", "hint": "the direct object", "cells": ["ein|en", "ein|e", "ein"]}, {"label": "Dative", "hint": "to or for someone, after mit, bei, von", "cells": ["ein|em", "ein|er", "ein|em"]}, {"label": "Genitive", "hint": "of something, mostly in writing", "cells": ["ein|es", "ein|er", "ein|es"]}], "notes": ["Only the masculine changes between nominative and accusative: ein Hund becomes einen Hund. Feminine and neuter stay the same.", "In the dative, masculine and neuter share the same form: einem.", "Masculine and neuter nominative have no ending at all, so ein Mann and ein Kind look alike.", "Learn this table once and you get more for free: kein, mein, dein, sein and unser take exactly the same endings."]}], "wordFamily": [{"german": "eins", "english": "one (when counting)", "type": "number"}, {"german": "kein", "english": "no, not a", "literal": "not one", "type": "article"}, {"german": "einmal", "english": "once; also used when ordering", "literal": "one time", "type": "adverb"}, {"german": "allein", "english": "alone", "literal": "all one", "type": "adjective / adverb"}, {"german": "einzig", "english": "only, single", "type": "adjective"}, {"german": "einige", "english": "some, a few", "type": "plural determiner"}, {"german": "irgendein", "english": "some, any (I don't care which)", "type": "determiner"}], "keyTrap": {"title": "The big trap: forgetting einen", "explanation": "Hund is masculine. When a masculine noun is the object of the sentence, ein has to become einen. Feminine and neuter nouns never change here, which is exactly why the masculine one is so easy to forget.", "wrong": {"german": "Ich habe ein Hund.", "verdict": "Hund is the object here, so it needs einen."}, "correct": [{"german": "Ich habe einen Hund.", "literal": "I have a dog.", "note": "Masculine object: einen."}, {"german": "Ein Hund wohnt hier.", "literal": "A dog lives here.", "note": "Masculine subject: plain ein."}, {"german": "Ich habe eine Katze und ein Kind.", "literal": "I have a cat and a child.", "note": "Feminine and neuter objects: no change."}]}, "commonMistakes": [{"title": "Jobs and nationalities", "explanation": "German usually leaves out ein when you say what someone is. Add it back only when there's an adjective: Er ist ein guter Lehrer.", "wrong": "Ich bin ein Lehrer.", "correct": "Ich bin Lehrer."}, {"title": "There's no plural", "explanation": "Ein means 'one', so it can't go with a plural noun. Drop it, or use einige (some).", "wrong": "ein Bücher", "correct": "Bücher, einige Bücher"}, {"title": "Saying 'not a'", "explanation": "German has a separate word for 'not a': kein. It takes the same endings as ein.", "wrong": "Ich habe nicht ein Auto.", "correct": "Ich habe kein Auto."}, {"title": "ein or eins?", "explanation": "Before a noun it's ein. When you count, or when 'one' stands on its own for a neuter thing, it gets an s.", "examples": [{"german": "eins, zwei, drei", "english": "one, two, three", "highlight": "s"}, {"german": "Ich möchte ein Brötchen.", "english": "I'd like a bread roll."}, {"german": "Ich möchte eins.", "english": "I'd like one.", "highlight": "s"}]}], "sampleSentences": [{"german": "Ich habe einen Bruder und eine Schwester.", "english": "I have a brother and a sister.", "highlight": ["einen", "eine"]}, {"german": "Ein Kaffee, bitte!", "english": "A coffee, please!", "highlight": ["Ein"]}, {"german": "Ich wohne in einem kleinen Dorf.", "english": "I live in a small village.", "highlight": ["einem"]}, {"german": "Sie arbeitet mit einer Freundin zusammen.", "english": "She works with a friend.", "highlight": ["einer"]}, {"german": "Wir haben nur ein Auto, nicht zwei.", "english": "We only have one car, not two. (Here ein means 'one', so you stress it.)", "highlight": ["ein"]}, {"german": "Das ist kein Problem.", "english": "That's no problem.", "highlight": ["kein"]}, {"german": "Einmal Currywurst mit Pommes, bitte.", "english": "One currywurst with fries, please.", "highlight": ["Einmal"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Ich sehe ein___ Mann.", "answer": "en", "acceptedAnswers": ["einen"], "fullAnswer": "Ich sehe einen Mann.", "explanation": "Mann is masculine and the object of sehen, so it's accusative: einen."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "Ich fahre mit ein___ Freundin.", "answer": "er", "acceptedAnswers": ["einer"], "fullAnswer": "Ich fahre mit einer Freundin.", "explanation": "Mit always takes the dative, and Freundin is feminine: einer."}, {"id": "q3", "type": "fill-in-the-blank", "prompt": "Das ist ___ Buch. (ein, eine or einen?)", "answer": "ein", "fullAnswer": "Das ist ein Buch.", "explanation": "Buch is neuter, and neuter never changes in the nominative or accusative."}, {"id": "q4", "type": "fill-in-the-blank", "prompt": "Ich habe ___ Auto. (I don't have a car.)", "answer": "kein", "fullAnswer": "Ich habe kein Auto.", "explanation": "'Not a' is kein, never nicht ein."}, {"id": "q5", "type": "open", "prompt": "How do you say \"I'm a teacher\" in German?", "acceptedAnswers": ["Ich bin Lehrer.", "Ich bin Lehrerin."], "explanation": "No ein with jobs: Lehrer for a man, Lehrerin for a woman."}], "memoryHook": "Ein is 'a' and 'one' at once. Only the masculine changes for the object: ein Hund wohnt hier, ich habe einen Hund.", "signOff": "Eins, zwei, drei, los!", "level": "A1", "levelSource": "Core grammar (A1 article)", "lessonType": "full"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "full", "word": {"headword": "Entschuldigung", "partOfSpeech": "noun, feminine (die Entschuldigung)", "pronunciation": {"respelling": "ent-SHOOL-dee-goong", "ipa": "ɛntˈʃʊldɪɡʊŋ", "notes": "Stress schul. The final g is a hard g, as in 'go'."}, "meaning": "excuse me; sorry; an apology", "shortDefinition": "What you say to get past someone, get attention or apologise for something small."}, "intro": {"title": "Your first useful word on the train", "paragraphs": ["The train is packed and you need to get off. You don't need a sentence. One word does the job: Entschuldigung!", "It's long, but it's built from pieces you'll keep meeting. And it has one important limit: it's for small things, not for real sympathy."]}, "etymology": {"title": "Where it comes from", "parts": [{"part": "ent-", "meaning": "away, removing", "note": "As in entfernen, to remove.", "emphasis": "none"}, {"part": "Schuld", "meaning": "guilt, blame; also debt"}, {"part": "-ig", "meaning": "adjective ending", "note": "schuldig: guilty"}, {"part": "-ung", "meaning": "noun ending", "note": "Every -ung noun is feminine."}], "literalMeaning": "an un-guilting", "summary": "When you say Entschuldigung, you're asking someone to take the guilt away from you.", "bonus": {"word": "die Schulden", "meaning": "debts", "note": "The same Schuld in the plural. In German, owing money and owing an apology come from one word."}}, "wordFamily": [{"german": "sich entschuldigen", "english": "to apologise", "type": "reflexive verb"}, {"german": "Entschuldigen Sie!", "english": "Excuse me! (formal)", "type": "phrase"}, {"german": "die Schuld", "english": "guilt, fault", "type": "noun"}, {"german": "schuldig", "english": "guilty", "type": "adjective"}, {"german": "Es tut mir leid.", "english": "I'm sorry.", "type": "phrase"}], "keyTrap": {"title": "The big trap: using it for sympathy", "explanation": "Entschuldigung is for your own small mistakes and for getting attention. When something bad happens to someone else, or you really regret something, German uses Es tut mir leid.", "wrong": {"german": "Entschuldigung, dass dein Hund krank ist.", "verdict": "This sounds like you made the dog sick."}, "correct": [{"german": "Es tut mir leid, dass dein Hund krank ist.", "literal": "It does me sorrow that your dog is ill.", "note": "Sympathy: es tut mir leid."}, {"german": "Entschuldigung, ist hier noch frei?", "literal": "Excuse me, is here still free?", "note": "Getting attention: Entschuldigung."}, {"german": "Entschuldigung, das war mein Fehler.", "literal": "Sorry, that was my mistake.", "note": "A small mistake of your own."}]}, "commonMistakes": [{"title": "Don't forget sich", "explanation": "The verb for apologising is reflexive: you excuse yourself.", "wrong": "Ich entschuldige.", "correct": "Ich entschuldige mich."}, {"title": "The gender", "explanation": "Every noun ending in -ung is feminine.", "wrong": "der Entschuldigung", "correct": "die Entschuldigung"}, {"title": "Apologising for something", "explanation": "To say what you're sorry for, use für.", "examples": [{"german": "Ich entschuldige mich für die Verspätung.", "english": "I apologise for being late.", "highlight": "für"}]}], "sampleSentences": [{"german": "Entschuldigung, wo ist der Bahnhof?", "english": "Excuse me, where is the station?", "highlight": ["Entschuldigung,"]}, {"german": "Entschuldigen Sie bitte, darf ich mal vorbei?", "english": "Excuse me, can I get past?", "highlight": ["Entschuldigen"]}, {"german": "Er hat sich bei ihr entschuldigt.", "english": "He apologised to her.", "highlight": ["entschuldigt."]}, {"german": "Das tut mir wirklich leid.", "english": "I'm really sorry about that.", "highlight": ["tut", "leid."]}, {"german": "Ich brauche eine Entschuldigung für die Schule.", "english": "I need a note excusing me from school.", "highlight": ["Entschuldigung"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Ich entschuldige ___ für den Fehler.", "answer": "mich", "fullAnswer": "Ich entschuldige mich für den Fehler.", "explanation": "Sich entschuldigen is reflexive."}, {"id": "q2", "type": "open", "prompt": "Your colleague tells you her grandmother is in hospital. What do you say?", "acceptedAnswers": ["Das tut mir leid.", "Es tut mir leid."], "explanation": "Sympathy is es tut mir leid, not Entschuldigung."}, {"id": "q3", "type": "fill-in-the-blank", "prompt": "___ Entschuldigung (der, die or das?)", "answer": "die", "fullAnswer": "die Entschuldigung", "explanation": "-ung nouns are always feminine."}, {"type": "choice", "prompt": "You bump into someone on the train. What do you say?", "options": ["Entschuldigung!", "Gern geschehen!", "Guten Appetit!"], "answer": "Entschuldigung!", "explanation": "A small mistake of your own.", "id": "q4"}, {"type": "fill-in-the-blank", "prompt": "Ich entschuldige mich ___ die Verspätung.", "answer": "für", "fullAnswer": "Ich entschuldige mich für die Verspätung.", "explanation": "You apologise für something.", "acceptedAnswers": ["fuer"], "id": "q5"}], "forms": ["Entschuldigungen", "entschuldigen", "entschuldige", "entschuldigt"], "memoryHook": "Ent + Schuld = guilt away. Use it to get past, get attention or own a small mistake. For real sorrow: es tut mir leid.", "signOff": "Entschuldigung, und danke!", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "full", "word": {"headword": "gefallen", "partOfSpeech": "verb (with the dative)", "pronunciation": {"respelling": "guh-FAL-en", "ipa": "ɡəˈfalən", "notes": "Stress fal. The a is short."}, "meaning": "to please, to appeal to", "shortDefinition": "Used to say you like something: Das gefällt mir."}, "intro": {"title": "The Like button", "paragraphs": ["If you've used Facebook in German, you've clicked gefallen many times. The Like button says Gefällt mir: it pleases me.", "That's the whole secret of this verb. In English you like the thing. In German the thing pleases you. The sentence is built the other way round."]}, "etymology": {"title": "Where it comes from", "parts": [{"part": "ge-", "meaning": "a prefix that adds completeness"}, {"part": "fallen", "meaning": "to fall"}], "literalMeaning": "to fall out well", "summary": "Something that gefällt you is something that has fallen out the right way for you, like a lucky throw of the dice.", "bonus": {"word": "der Gefallen", "meaning": "a favour", "note": "Same spelling, but a noun: Kannst du mir einen Gefallen tun? Can you do me a favour?"}}, "tables": [{"title": "Who's who", "intro": "The thing you like is the subject, so the verb agrees with it. The person who likes it goes in the dative.", "columns": ["one thing", "several things"], "rows": [{"label": "I like", "cells": ["… gefällt |mir", "… gefallen |mir"]}, {"label": "you like", "cells": ["… gefällt |dir", "… gefallen |dir"]}, {"label": "he likes", "cells": ["… gefällt |ihm", "… gefallen |ihm"]}, {"label": "she likes", "cells": ["… gefällt |ihr", "… gefallen |ihr"]}, {"label": "we like", "cells": ["… gefällt |uns", "… gefallen |uns"]}, {"label": "you (formal) like", "cells": ["… gefällt |Ihnen", "… gefallen |Ihnen"]}], "notes": ["Das Kleid gefällt mir. Die Schuhe gefallen mir. The verb changes with the thing, not with you.", "Past: Der Film hat mir gefallen."]}], "wordFamily": [{"german": "der Gefallen", "english": "favour", "type": "noun"}, {"german": "mögen", "english": "to like", "type": "verb"}, {"german": "gern", "english": "gladly (to like doing)", "type": "adverb"}, {"german": "schmecken", "english": "to taste good", "type": "verb"}], "keyTrap": {"title": "The big trap: making yourself the subject", "explanation": "English speakers put themselves first, as the one doing the liking. With gefallen, you're the one being pleased, so you go in the dative.", "wrong": {"german": "Ich gefalle das Buch.", "verdict": "This says 'I please the book'."}, "correct": [{"german": "Das Buch gefällt mir.", "literal": "The book pleases me.", "note": "The thing is the subject."}, {"german": "Mir gefällt das Buch.", "literal": "To me pleases the book.", "note": "Same meaning, with the emphasis on you."}, {"german": "Ich mag das Buch.", "literal": "I like the book.", "note": "Or use mögen, which works like English."}]}, "commonMistakes": [{"title": "Food uses schmecken", "explanation": "Gefallen is for how something looks, sounds or feels. For taste, Germans say schmecken.", "wrong": "Die Suppe gefällt mir.", "correct": "Die Suppe schmeckt mir."}, {"title": "Plural things", "explanation": "When the thing is plural, the verb is too.", "wrong": "Die Blumen gefällt mir.", "correct": "Die Blumen gefallen mir."}, {"title": "First impressions", "explanation": "Gefallen is about first impressions. For a friend you know well, mögen sounds warmer.", "examples": [{"german": "Berlin gefällt mir.", "english": "I like Berlin (what I've seen of it).", "highlight": "gefällt"}, {"german": "Ich mag meine Kollegen.", "english": "I like my colleagues.", "highlight": "mag"}]}], "sampleSentences": [{"german": "Wie gefällt dir die neue Wohnung?", "english": "How do you like the new flat?", "highlight": ["gefällt", "dir"]}, {"german": "Die Farbe gefällt mir nicht.", "english": "I don't like the colour.", "highlight": ["gefällt", "mir"]}, {"german": "Hat Ihnen der Film gefallen?", "english": "Did you like the film?", "highlight": ["Ihnen", "gefallen?"]}, {"german": "Die Kinder gefallen der Oma sehr.", "english": "Grandma really likes the children.", "highlight": ["gefallen", "der", "Oma"]}, {"german": "Kannst du mir einen Gefallen tun?", "english": "Can you do me a favour?", "highlight": ["Gefallen"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Die Stadt gefällt ___. (me)", "answer": "mir", "fullAnswer": "Die Stadt gefällt mir.", "explanation": "The person who likes it is in the dative: mir."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "Die Schuhe ___ mir.", "answer": "gefallen", "fullAnswer": "Die Schuhe gefallen mir.", "explanation": "Schuhe is plural, so the verb is plural."}, {"id": "q3", "type": "fill-in-the-blank", "prompt": "Der Kuchen ___ mir sehr gut. (it tastes good)", "answer": "schmeckt", "fullAnswer": "Der Kuchen schmeckt mir sehr gut.", "explanation": "For food, use schmecken."}, {"type": "choice", "prompt": "Berlin ___ mir sehr.", "options": ["gefällt", "gefallen"], "answer": "gefällt", "explanation": "Berlin is one thing, so the verb is singular.", "id": "q4"}, {"type": "choice", "prompt": "Wie hat ___ der Film gefallen? (you, informal)", "options": ["du", "dich", "dir"], "answer": "dir", "explanation": "The person who likes it is in the dative: dir.", "id": "q5"}], "forms": ["gefällt", "gefiel", "gefallen", "gefällst"], "memoryHook": "Think of the Like button: Gefällt mir. The thing pleases me, so the thing comes first and I'm the mir.", "signOff": "Hat es dir gefallen?", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "full", "word": {"headword": "gern", "partOfSpeech": "adverb (also gerne)", "pronunciation": {"respelling": "GAIRN", "ipa": "ɡɛʁn", "notes": "Gern and gerne mean the same. Gerne is a little softer and very common in speech."}, "meaning": "gladly; used to say you like doing something", "shortDefinition": "Add it to any verb to say you enjoy doing it."}, "intro": {"title": "The easiest way to say 'I like'", "paragraphs": ["German doesn't need a special verb to say you like doing something. You just do the thing, gladly: Ich schwimme gern. I swim gladly, I like swimming.", "Gern is one of the most useful words at A1. It turns every verb you know into a preference, and it's also how Germans say 'you're welcome'."]}, "etymology": {"title": "Where it comes from", "summary": "Gern comes from an old Germanic word meaning eager or desiring. English kept the same root in the verb 'yearn'.", "cognates": [{"word": "yearn", "language": "English", "note": "to long for"}, {"word": "gern", "language": "German", "note": "eagerly, gladly"}, {"word": "begehren", "language": "German", "note": "to desire, from the same root"}]}, "tables": [{"title": "Like, prefer, like most", "intro": "Gern has irregular comparative forms, which you'll use all the time.", "columns": ["form", "example"], "rows": [{"label": "like", "cells": ["|gern", "Ich trinke gern Tee."]}, {"label": "prefer", "cells": ["|lieber", "Ich trinke lieber Kaffee."]}, {"label": "like most", "cells": ["am |liebsten", "Ich trinke am liebsten Wasser."]}], "notes": ["Never gerner. The comparative is lieber, from the same root as lieb (dear)."]}], "wordFamily": [{"german": "gern haben", "english": "to be fond of (a person)", "type": "phrase"}, {"german": "Gern geschehen!", "english": "You're welcome!", "literal": "gladly happened", "type": "phrase"}, {"german": "lieber", "english": "rather, preferably", "type": "adverb"}, {"german": "am liebsten", "english": "most of all", "type": "adverb"}, {"german": "mögen", "english": "to like (things)", "type": "verb"}], "keyTrap": {"title": "The big trap: word order", "explanation": "Gern is an adverb, not a verb, so the real verb still has to take second place. Gern comes after it.", "wrong": {"german": "Ich gern spiele Tennis.", "verdict": "The verb has to come second."}, "correct": [{"german": "Ich spiele gern Tennis.", "literal": "I play gladly tennis.", "note": "Verb second, then gern."}, {"german": "Spielst du gern Tennis?", "literal": "Play you gladly tennis?", "note": "In a question the verb comes first."}, {"german": "Ich spiele nicht gern Tennis.", "literal": "I play not gladly tennis.", "note": "Nicht goes right before gern."}]}, "commonMistakes": [{"title": "gern for doing, mögen for things", "explanation": "Use gern with a verb. With a noun, mögen is more natural.", "wrong": "Ich gern Pizza.", "correct": "Ich mag Pizza. / Ich esse gern Pizza."}, {"title": "The comparative", "explanation": "It's irregular, so there's no gerner.", "wrong": "Ich trinke gerner Tee.", "correct": "Ich trinke lieber Tee."}, {"title": "Ordering", "explanation": "Ich hätte gern … is the polite way to ask for something in a shop or café.", "examples": [{"german": "Ich hätte gern ein Brötchen.", "english": "I'd like a bread roll.", "highlight": "gern"}]}], "sampleSentences": [{"german": "Ich koche gern, aber ich spüle nicht gern.", "english": "I like cooking, but I don't like washing up.", "highlight": ["gern,", "gern."]}, {"german": "Was machst du gern am Wochenende?", "english": "What do you like doing at the weekend?", "highlight": ["gern"]}, {"german": "Danke! – Gern geschehen.", "english": "Thanks! – You're welcome.", "highlight": ["Gern"]}, {"german": "Ich fahre lieber mit dem Zug.", "english": "I'd rather take the train.", "highlight": ["lieber"]}, {"german": "Am liebsten esse ich Nudeln.", "english": "Pasta is my favourite food.", "highlight": ["liebsten"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Ich ___ gern Musik. (hören)", "answer": "höre", "acceptedAnswers": ["hoere"], "fullAnswer": "Ich höre gern Musik.", "explanation": "The verb comes second, gern follows it."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "Tee oder Kaffee? Ich trinke ___ Tee. (prefer)", "answer": "lieber", "fullAnswer": "Ich trinke lieber Tee.", "explanation": "Gern, lieber, am liebsten."}, {"id": "q3", "type": "open", "prompt": "Someone says Danke! What do you answer?", "acceptedAnswers": ["Gern geschehen!", "Gerne!", "Bitte!"], "explanation": "Gern geschehen, or just Gerne."}, {"type": "choice", "prompt": "Which sentence is correct?", "options": ["Ich gern lese.", "Ich lese gern."], "answer": "Ich lese gern.", "explanation": "The verb comes second, gern after it.", "id": "q4"}, {"type": "fill-in-the-blank", "prompt": "Am ___ esse ich Pizza. (most of all)", "answer": "liebsten", "fullAnswer": "Am liebsten esse ich Pizza.", "explanation": "Gern, lieber, am liebsten.", "id": "q5"}], "forms": ["gerne", "lieber", "am liebsten"], "memoryHook": "Gern = gladly. Do the thing, then add gern: Ich tanze gern. Better is lieber, best is am liebsten.", "signOff": "Gern geschehen!", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "full", "word": {"headword": "kennen", "partOfSpeech": "verb", "pronunciation": {"respelling": "KEN-en", "ipa": "ˈkɛnən", "notes": "Short e, as in 'ten'."}, "meaning": "to know (a person, place or thing)", "shortDefinition": "To be familiar with someone or something."}, "intro": {"title": "Two ways to know", "paragraphs": ["English has one verb, 'know'. German has two, and they're not interchangeable. Kennen means knowing someone or something because you've met it. Wissen means knowing a fact.", "Ich kenne Anna: I know Anna. Ich weiß, wo Anna wohnt: I know where Anna lives. Getting this right is one of the clearest signs of a learner who's past the first weeks."]}, "etymology": {"title": "Where it comes from", "summary": "Kennen shares an ancient root with English 'know' and 'can'. In Scotland the word survived almost unchanged.", "cognates": [{"word": "ken", "language": "Scots", "note": "I dinnae ken: I don't know"}, {"word": "ken", "language": "English", "note": "'beyond my ken': outside what I know"}, {"word": "kennen", "language": "Dutch", "note": "the same word and meaning"}, {"word": "können", "language": "German", "note": "originally 'to know how'"}], "bonus": {"word": "kennenlernen", "meaning": "to get to know, to meet", "literalMeaning": "to learn to know", "note": "Freut mich, Sie kennenzulernen: pleased to meet you."}}, "tables": [{"title": "kennen and wissen side by side", "intro": "Kennen is regular. Wissen is irregular in the singular.", "columns": ["kennen", "wissen"], "rows": [{"label": "ich", "cells": ["kenn|e", "|weiß"]}, {"label": "du", "cells": ["kenn|st", "|weißt"]}, {"label": "er, sie, es", "cells": ["kenn|t", "|weiß"]}, {"label": "wir", "cells": ["kenn|en", "wiss|en"]}, {"label": "ihr", "cells": ["kenn|t", "wiss|t"]}, {"label": "sie, Sie", "cells": ["kenn|en", "wiss|en"]}], "notes": ["Ich weiß and er weiß are the same, with no -t on er weiß.", "Kennen is followed by a noun. Wissen is usually followed by a clause: dass, wo, wie, wann, ob."]}], "wordFamily": [{"german": "kennenlernen", "english": "to get to know, to meet", "type": "separable verb"}, {"german": "bekannt", "english": "well known, familiar", "type": "adjective"}, {"german": "der/die Bekannte", "english": "acquaintance", "type": "noun"}, {"german": "erkennen", "english": "to recognise", "type": "verb"}, {"german": "wissen", "english": "to know (a fact)", "type": "verb"}], "keyTrap": {"title": "The big trap: kennen or wissen?", "explanation": "Ask yourself: is it a person, place or thing I've met? Use kennen. Is it a fact or the answer to a question? Use wissen.", "wrong": {"german": "Ich kenne, wo er wohnt.", "verdict": "Where he lives is a fact, so it needs wissen."}, "correct": [{"german": "Ich weiß, wo er wohnt.", "literal": "I know where he lives.", "note": "A fact: wissen."}, {"german": "Ich kenne ihn.", "literal": "I know him.", "note": "A person: kennen."}, {"german": "Kennst du Hamburg?", "literal": "Know you Hamburg?", "note": "A place: kennen."}]}, "commonMistakes": [{"title": "Knowing a city", "explanation": "Places are kennen, never wissen.", "wrong": "Ich weiß Berlin gut.", "correct": "Ich kenne Berlin gut."}, {"title": "I don't know", "explanation": "The everyday 'I don't know' is about a fact, so it's wissen.", "wrong": "Ich kenne nicht.", "correct": "Ich weiß nicht."}, {"title": "Meeting someone", "explanation": "For meeting someone for the first time, German uses kennenlernen.", "examples": [{"german": "Wir haben uns im Kurs kennengelernt.", "english": "We met on the course.", "highlight": "kennengelernt."}]}], "sampleSentences": [{"german": "Kennen Sie diesen Mann?", "english": "Do you know this man?", "highlight": ["Kennen"]}, {"german": "Ich kenne ein gutes Restaurant in der Nähe.", "english": "I know a good restaurant nearby.", "highlight": ["kenne"]}, {"german": "Weißt du, wann der Zug kommt?", "english": "Do you know when the train is coming?", "highlight": ["Weißt"]}, {"german": "Das weiß ich leider nicht.", "english": "I'm afraid I don't know.", "highlight": ["weiß"]}, {"german": "Freut mich, Sie kennenzulernen.", "english": "Pleased to meet you.", "highlight": ["kennenzulernen."]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "___ du meine Schwester? (kennen or wissen?)", "answer": "Kennst", "fullAnswer": "Kennst du meine Schwester?", "explanation": "A person: kennen."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "Ich ___ nicht, wie spät es ist.", "answer": "weiß", "acceptedAnswers": ["weiss"], "fullAnswer": "Ich weiß nicht, wie spät es ist.", "explanation": "A fact, followed by wie: wissen."}, {"id": "q3", "type": "fill-in-the-blank", "prompt": "Er ___ die Antwort. (wissen)", "answer": "weiß", "acceptedAnswers": ["weiss"], "fullAnswer": "Er weiß die Antwort.", "explanation": "Er weiß, with no -t."}, {"type": "choice", "prompt": "___ du, wo der Bahnhof ist?", "options": ["Kennst", "Weißt"], "answer": "Weißt", "explanation": "Where the station is is a fact: wissen.", "id": "q4"}, {"type": "choice", "prompt": "Ich ___ Paris sehr gut.", "options": ["kenne", "weiß"], "answer": "kenne", "explanation": "A place you know: kennen.", "id": "q5"}], "forms": ["kenne", "kennst", "kennt", "kannte", "gekannt", "weiß", "weißt", "wusste", "gewusst"], "memoryHook": "Kennen is who and where you've met. Wissen is what you've learned. Ich kenne Anna, ich weiß ihre Nummer.", "signOff": "Jetzt weißt du es!", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "full", "word": {"headword": "mit", "partOfSpeech": "preposition (always with the dative)", "pronunciation": {"respelling": "MIT", "ipa": "mɪt", "notes": "Short i, exactly like English 'mitt'."}, "meaning": "with; by (for transport)", "shortDefinition": "Says who or what goes together, or how you travel."}, "intro": {"title": "Small word, one strict rule", "paragraphs": ["Mit means 'with', and you'll use it constantly: with friends, with milk, with the bus. The meaning is easy.", "The challenge is the grammar. Mit always takes the dative, every time, no exceptions. Learn the dative endings with mit and you've learned them for a dozen other prepositions too."]}, "etymology": {"title": "Where it comes from", "summary": "Mit is an old Germanic word for 'with'. English used to have it too: it survives in 'midwife', literally the 'with-woman' who stays with the mother.", "cognates": [{"word": "met", "language": "Dutch", "note": "with"}, {"word": "med", "language": "Swedish", "note": "with"}, {"word": "midwife", "language": "English", "note": "the 'with-woman'"}]}, "tables": [{"title": "mit + dative", "intro": "After mit, every article and possessive takes its dative ending.", "columns": ["masculine", "feminine", "neuter", "plural"], "rows": [{"label": "the", "cells": ["mit d|em", "mit d|er", "mit d|em", "mit d|en …n"]}, {"label": "a", "cells": ["mit ein|em", "mit ein|er", "mit ein|em", "mit …n"]}, {"label": "my", "cells": ["mit mein|em", "mit mein|er", "mit mein|em", "mit mein|en …n"]}], "notes": ["In the dative plural the noun itself usually gets an extra -n: mit den Kindern.", "Pronouns change too: mit mir, mit dir, mit ihm, mit ihr, mit uns, mit Ihnen."]}], "wordFamily": [{"german": "mitkommen", "english": "to come along", "type": "separable verb"}, {"german": "mitnehmen", "english": "to take along", "type": "separable verb"}, {"german": "mitbringen", "english": "to bring along", "type": "separable verb"}, {"german": "der Mitarbeiter", "english": "employee, colleague", "literal": "with-worker", "type": "noun"}, {"german": "miteinander", "english": "with each other", "type": "adverb"}], "keyTrap": {"title": "The big trap: forgetting the dative", "explanation": "Learners often use the plain form after mit. It always needs the dative ending.", "wrong": {"german": "Ich gehe mit mein Bruder ins Kino.", "verdict": "Mit takes the dative: meinem."}, "correct": [{"german": "Ich gehe mit meinem Bruder ins Kino.", "literal": "I go with my brother to the cinema.", "note": "Masculine dative: meinem."}, {"german": "Ich gehe mit meiner Schwester ins Kino.", "literal": "I go with my sister to the cinema.", "note": "Feminine dative: meiner."}, {"german": "Kommst du mit uns?", "literal": "Come you with us?", "note": "Pronouns: uns, not wir."}]}, "commonMistakes": [{"title": "Travelling 'by'", "explanation": "English says 'by train'. German says 'with the train', and it needs the article.", "wrong": "Ich fahre mit Zug.", "correct": "Ich fahre mit dem Zug."}, {"title": "On foot is different", "explanation": "Walking isn't mit anything: zu Fuß.", "wrong": "Ich gehe mit den Füßen.", "correct": "Ich gehe zu Fuß."}, {"title": "Coming along", "explanation": "Mit is also a separable prefix. At the end of a question it means 'along'.", "examples": [{"german": "Kommst du mit?", "english": "Are you coming along?", "highlight": "mit?"}]}], "sampleSentences": [{"german": "Ich trinke Kaffee mit Milch.", "english": "I drink coffee with milk.", "highlight": ["mit"]}, {"german": "Sie fährt jeden Tag mit dem Bus.", "english": "She takes the bus every day.", "highlight": ["mit", "dem"]}, {"german": "Darf ich mit Karte zahlen?", "english": "Can I pay by card?", "highlight": ["mit"]}, {"german": "Ich wohne mit zwei Freunden zusammen.", "english": "I live with two friends.", "highlight": ["mit", "Freunden"]}, {"german": "Wir gehen ins Kino. Kommst du mit?", "english": "We're going to the cinema. Are you coming?", "highlight": ["mit?"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Ich fahre mit ___ Fahrrad. (das)", "answer": "dem", "fullAnswer": "Ich fahre mit dem Fahrrad.", "explanation": "Neuter dative: dem."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "Er spricht mit ___ Lehrerin. (die)", "answer": "der", "fullAnswer": "Er spricht mit der Lehrerin.", "explanation": "Feminine dative: der."}, {"id": "q3", "type": "fill-in-the-blank", "prompt": "Möchtest du mit ___ essen? (I)", "answer": "mir", "fullAnswer": "Möchtest du mit mir essen?", "explanation": "Ich becomes mir in the dative."}, {"type": "choice", "prompt": "Ich fahre ___ Bus.", "options": ["mit dem", "mit der", "mit den"], "answer": "mit dem", "explanation": "Der Bus is masculine, so the dative is dem.", "id": "q4"}, {"type": "choice", "prompt": "Ich komme mit ___. (you, informal)", "options": ["du", "dich", "dir"], "answer": "dir", "explanation": "Mit takes the dative: dir.", "id": "q5"}], "forms": ["mitkommen", "mitnehmen", "mitbringen"], "memoryHook": "Mit is always with the dative, and the dative is always with mit: mit dem, mit der, mit dem, mit den.", "signOff": "Kommst du mit?", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "full", "word": {"headword": "Termin", "partOfSpeech": "noun, masculine (der Termin)", "pronunciation": {"respelling": "tair-MEEN", "ipa": "tɛʁˈmiːn", "notes": "Stress the second syllable, unlike English 'term'. Plural: die Termine."}, "meaning": "appointment; fixed date", "shortDefinition": "A booked time with a doctor, an office, a business or a client."}, "intro": {"title": "Life in Germany runs on Termine", "paragraphs": ["Want to see a doctor, register your address or open a bank account? You'll need a Termin. Germans book nearly everything in advance, so this word turns up in your first week.", "It looks like English 'term', but it means appointment. And it's mainly for official or professional appointments, not for meeting friends."]}, "etymology": {"title": "Where it comes from", "summary": "Termin comes from Latin terminus: a boundary stone, an end point. A Termin is a fixed point in time. English took the same Latin word and made 'term', 'terminal' and 'terminate' from it.", "cognates": [{"word": "terminus", "language": "Latin", "note": "boundary, end point"}, {"word": "term", "language": "English", "note": "a fixed period"}, {"word": "terminal", "language": "English", "note": "the end of the line"}]}, "wordFamily": [{"german": "der Arzttermin", "english": "doctor's appointment", "type": "noun"}, {"german": "der Terminkalender", "english": "diary, calendar", "type": "noun"}, {"german": "einen Termin vereinbaren", "english": "to arrange an appointment", "type": "phrase"}, {"german": "die Verabredung", "english": "a date or plan to meet friends", "type": "noun"}, {"german": "das Semester", "english": "term (at university)", "type": "noun"}], "keyTrap": {"title": "The big trap: a Termin with friends", "explanation": "A Termin is a booked, businesslike appointment. Meeting a friend for coffee is a Verabredung, or you can just say you're meeting.", "wrong": {"german": "Ich habe heute einen Termin mit Lisa im Café.", "verdict": "This sounds like a business meeting with Lisa."}, "correct": [{"german": "Ich bin heute mit Lisa verabredet.", "literal": "I am today with Lisa arranged.", "note": "Friends: verabredet sein."}, {"german": "Ich treffe Lisa heute im Café.", "literal": "I meet Lisa today in the café.", "note": "The simplest option."}, {"german": "Ich habe morgen einen Termin beim Zahnarzt.", "literal": "I have tomorrow an appointment at the dentist.", "note": "Doctor, office, business: Termin."}]}, "commonMistakes": [{"title": "It's not a 'term'", "explanation": "For a school or university term, German says Semester or Halbjahr. For a word or concept, it's der Begriff.", "wrong": "das neue Termin an der Uni", "correct": "das neue Semester an der Uni"}, {"title": "At the doctor's", "explanation": "With people and their practices, use bei: beim Arzt, bei der Ärztin.", "wrong": "einen Termin mit dem Arzt", "correct": "einen Termin beim Arzt"}, {"title": "The plural", "explanation": "Add -e.", "forms": [{"label": "One", "value": "der Termin"}, {"label": "More than one", "value": "die Termine"}]}], "sampleSentences": [{"german": "Ich möchte einen Termin machen.", "english": "I'd like to make an appointment.", "highlight": ["Termin"]}, {"german": "Haben Sie morgen Vormittag einen Termin frei?", "english": "Do you have a free appointment tomorrow morning?", "highlight": ["Termin"]}, {"german": "Ich muss meinen Termin leider absagen.", "english": "Unfortunately I have to cancel my appointment.", "highlight": ["Termin"]}, {"german": "Der Termin ist am Montag um zehn Uhr.", "english": "The appointment is on Monday at ten.", "highlight": ["Termin"]}, {"german": "Diese Woche habe ich viele Termine.", "english": "I've got a lot of appointments this week.", "highlight": ["Termine."]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Ich habe einen Termin ___ Arzt.", "answer": "beim", "fullAnswer": "Ich habe einen Termin beim Arzt.", "explanation": "bei + dem = beim."}, {"id": "q2", "type": "fill-in-the-blank", "prompt": "Am Freitag habe ich drei ___.", "answer": "Termine", "fullAnswer": "Am Freitag habe ich drei Termine.", "explanation": "The plural adds -e."}, {"id": "q3", "type": "open", "prompt": "How do you say \"I'm meeting Tom for a drink tonight\" without using Termin?", "acceptedAnswers": ["Ich bin heute Abend mit Tom verabredet.", "Ich treffe Tom heute Abend."], "explanation": "Friends: verabredet sein or treffen."}, {"type": "choice", "prompt": "___ Termin", "options": ["der", "die", "das"], "answer": "der", "explanation": "Termin is masculine.", "id": "q4"}, {"type": "choice", "prompt": "You're meeting a friend for coffee. Which is better?", "options": ["Ich habe einen Termin mit Anna.", "Ich bin mit Anna verabredet."], "answer": "Ich bin mit Anna verabredet.", "explanation": "Friends: verabredet sein.", "id": "q5"}], "forms": ["Termine", "Termins"], "memoryHook": "A Termin is a terminus: a fixed point on the calendar with someone official. Friends get a Verabredung.", "signOff": "Bis zum nächsten Termin!", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "card", "word": {"headword": "Tisch", "partOfSpeech": "noun, masculine (der Tisch)", "pronunciation": {"respelling": "TISH", "ipa": "tɪʃ", "notes": "Short i. Plural: die Tische."}, "meaning": "table", "shortDefinition": "A table."}, "etymology": {"title": "Where it comes from", "summary": "Tisch, English 'dish', 'desk' and 'disc' all come from Latin discus, a flat round plate. In German the plate grew into the whole table.", "cognates": [{"word": "discus", "language": "Latin", "note": "a flat plate"}, {"word": "dish", "language": "English"}, {"word": "desk", "language": "English"}]}, "commonMistakes": [{"title": "Gender and plural", "explanation": "Der Tisch, plural die Tische.", "forms": [{"label": "One", "value": "der Tisch"}, {"label": "More than one", "value": "die Tische"}]}, {"title": "at the table or on the table", "explanation": "You sit an dem Tisch (am Tisch). Things lie auf dem Tisch.", "examples": [{"german": "Wir sitzen am Tisch.", "english": "We're sitting at the table.", "highlight": "am"}, {"german": "Das Buch liegt auf dem Tisch.", "english": "The book is on the table.", "highlight": "auf"}]}], "sampleSentences": [{"german": "Das Essen steht auf dem Tisch.", "english": "Dinner's on the table.", "highlight": ["Tisch."]}, {"german": "Ich möchte einen Tisch für zwei Personen reservieren.", "english": "I'd like to book a table for two.", "highlight": ["Tisch"]}, {"german": "Bitte deck den Tisch.", "english": "Please lay the table.", "highlight": ["Tisch."]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Die Schlüssel liegen ___ dem Tisch. (on)", "answer": "auf", "fullAnswer": "Die Schlüssel liegen auf dem Tisch.", "explanation": "On top of: auf."}, {"type": "choice", "prompt": "___ Tisch", "options": ["der", "die", "das"], "answer": "der", "explanation": "Tisch is masculine.", "id": "q2"}, {"type": "fill-in-the-blank", "prompt": "ein Tisch, zwei ___", "answer": "Tische", "fullAnswer": "ein Tisch, zwei Tische", "explanation": "The plural adds -e.", "id": "q3"}, {"type": "choice", "prompt": "Wir sitzen ___ Tisch und essen.", "options": ["am", "auf dem"], "answer": "am", "explanation": "You sit at the table: am Tisch.", "id": "q4"}, {"type": "fill-in-the-blank", "prompt": "Bitte deck den ___. (Please lay the table.)", "answer": "Tisch", "fullAnswer": "Bitte deck den Tisch.", "explanation": "Den Tisch decken: to lay the table.", "id": "q5"}], "forms": ["Tische", "Tisches", "Tischen"], "memoryHook": "A Tisch started life as a dish. Same word, bigger furniture.", "signOff": "Guten Appetit!", "levelSource": "Goethe-Zertifikat A1 Wortliste"}, {"schemaVersion": "1.4", "language": "de", "explanationLanguage": "en", "level": "A1", "lessonType": "card", "word": {"headword": "Wohnung", "partOfSpeech": "noun, feminine (die Wohnung)", "pronunciation": {"respelling": "VOH-noong", "ipa": "ˈvoːnʊŋ", "notes": "W sounds like English v. Long o. Plural: die Wohnungen."}, "meaning": "flat, apartment", "shortDefinition": "A flat or apartment."}, "etymology": {"title": "Where it comes from", "parts": [{"part": "wohn-", "meaning": "from wohnen, to live (somewhere)"}, {"part": "-ung", "meaning": "noun ending", "note": "Every -ung noun is feminine."}], "literalMeaning": "a living-place", "summary": "Take the verb wohnen, add -ung, and you get the place where you live."}, "wordFamily": [{"german": "wohnen", "english": "to live (at an address)", "type": "verb"}, {"german": "das Wohnzimmer", "english": "living room", "type": "noun"}, {"german": "die WG (Wohngemeinschaft)", "english": "shared flat", "type": "noun"}, {"german": "das Haus", "english": "house", "type": "noun"}], "commonMistakes": [{"title": "wohnen or leben?", "explanation": "For your address or city, use wohnen. Leben is about being alive or your life in general.", "wrong": "Ich lebe in der Goethestraße 5.", "correct": "Ich wohne in der Goethestraße 5."}, {"title": "Gender and plural", "explanation": "-ung is always feminine, and the plural adds -en.", "forms": [{"label": "One", "value": "die Wohnung"}, {"label": "More than one", "value": "die Wohnungen"}]}], "sampleSentences": [{"german": "Wir suchen eine Wohnung mit zwei Zimmern.", "english": "We're looking for a two-room flat.", "highlight": ["Wohnung"]}, {"german": "Meine Wohnung ist klein, aber hell.", "english": "My flat is small but bright.", "highlight": ["Wohnung"]}, {"german": "Wo wohnst du? – In einer WG in Köln.", "english": "Where do you live? – In a shared flat in Cologne.", "highlight": ["wohnst"]}], "quiz": [{"id": "q1", "type": "fill-in-the-blank", "prompt": "Ich ___ in Hamburg. (wohnen)", "answer": "wohne", "fullAnswer": "Ich wohne in Hamburg.", "explanation": "Your address or city: wohnen."}, {"type": "choice", "prompt": "___ Wohnung", "options": ["der", "die", "das"], "answer": "die", "explanation": "Every -ung noun is feminine.", "id": "q2"}, {"type": "fill-in-the-blank", "prompt": "eine Wohnung, zwei ___", "answer": "Wohnungen", "fullAnswer": "eine Wohnung, zwei Wohnungen", "explanation": "The plural adds -en.", "id": "q3"}, {"type": "choice", "prompt": "Ich ___ in der Bahnhofstraße 3.", "options": ["lebe", "wohne"], "answer": "wohne", "explanation": "Your address: wohnen.", "id": "q4"}, {"type": "fill-in-the-blank", "prompt": "das ___zimmer (living room)", "answer": "Wohn", "fullAnswer": "das Wohnzimmer", "explanation": "Wohnzimmer: the room you live in.", "id": "q5"}], "forms": ["Wohnungen", "wohnen", "wohne", "wohnst", "wohnt"], "memoryHook": "Wohnen + -ung = Wohnung, the place where you wohnst.", "signOff": "Willkommen zu Hause!", "levelSource": "Goethe-Zertifikat A1 Wortliste"}]</script>

      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);

  }
  function arr(x) { return Array.isArray(x) ? x : []; }

  /* split the headword into the etymology parts: lang + weil + ig */
  function segments(word, parts) {

      if (!len) return [word];
      out.push(word.substr(pos, len)); pos += len;
    }
    if (pos < word.length) out[out.length - 1] += word.slice(pos);

  /* mark adjective endings: "ein langweiliger Film" + "er" */
  function highlightEnding(text, stem, ending) {
    if (!ending) return text;

      return [w.slice(0, at).join(""), h("mark", { text: w[at] }), w.slice(at + 1).join("")];

    var i = m.index + m[1].length;

  /* color every form of the headword family inside a German sentence */
  function inkFamily(text, stems) {

  }

  /* color exactly the words a sentence lists in "highlight", e.g. kommst … an */
  function inkWords(text, words) {
    var want = words.map(function (w) { return w.toLowerCase().replace(/[.,!?…]+$/, ""); });

  }

  function render(L) {
    var root = document.getElementById("lesson");
    root.textContent = "";
    var W = L.word || {};
    var ety = L.etymology || {};
    var parts = arr(ety.parts);
    var head = W.headword || "";
    document.title = head ? head + " Lesson" : "Vocabulary Lesson";

    var names = { de: "German", en: "English", fr: "French", es: "Spanish" };
    document.getElementById("pair").textContent =
      (names[L.language] || "Vocabulary") + " vocabulary" + (L.level ? ", level " + L.level : "") +
      (L.lessonType === "card" ? ", short card" : "");

    /* hero */
    var segs = parts.length ? segments(head, parts) : [head];
    /* which part gets the hero animation: "emphasis" in the JSON, else the middle of three */
    var fx = segs.map(function () { return ""; });
    if (segs.length === parts.length) parts.forEach(function (p, i) { if (p.emphasis) fx[i] = p.emphasis; });
    if (fx.join("") === "" && segs.length >= 3) fx[1] = "stretch";
    var P = W.pronunciation || {};
    root.appendChild(h("header", { class: "hero" },
      W.partOfSpeech && h("p", { class: "pos", text: W.partOfSpeech }),
      h("h1", { class: "headword", lang: L.language || "de", "aria-label": head },
        segs.map(function (s, i) { return h("span", { class: "seg" + (/^(stretch|arrive)$/.test(fx[i]) ? " " + fx[i] : ""), "aria-hidden": "true", text: s }); })),
      W.meaning && h("p", { class: "meaning", text: W.meaning }),
      (P.respelling || P.ipa) && h("p", { class: "say" },
        P.respelling && h("span", null, "Say it ", h("b", { text: P.respelling })),
        P.ipa && h("span", null, "IPA ", h("b", { text: "/" + P.ipa + "/" }))),
      P.notes && h("p", { class: "say-note", text: P.notes })
    ));

    var main = h("main");
    root.appendChild(main);

    /* intro */
    if (L.intro) main.appendChild(h("section", null,
      h("h2", { text: L.intro.title }),
      h("div", { class: "prose" }, arr(L.intro.paragraphs).map(function (p) { return h("p", { text: p }); }))));

    /* forms cycle in the hero: ein → eine → einen … → ein */
    var cyc = arr(W.cycle);
    if (cyc.length > 1 && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      var h1 = root.querySelector(".headword");
      h1.textContent = "";
      var stemEl = h("span", { class: "seg", "aria-hidden": "true", text: head });
      var endEl = h("span", { class: "seg ending", "aria-hidden": "true" });
      h1.appendChild(stemEl); h1.appendChild(endEl);
      var step = 0;
      var timer = setInterval(function () {
        step++;
        var f = cyc[step] || head;
        var stem = f.toLowerCase().indexOf(head.toLowerCase()) === 0 ? head : "";
        stemEl.textContent = stem || f;
        endEl.textContent = stem ? f.slice(head.length) : "";
        if (step >= cyc.length - 1) clearInterval(timer);
      }, 650);
    }

    /* etymology */
    if (parts.length || ety.cognates || ety.summary) {
      var eq = [];
      parts.forEach(function (p, i) {
        if (i) eq.push(h("span", { class: "op", "aria-hidden": "true", text: "+" }));
        eq.push(h("div", { class: "term" },
          h("span", { class: "word", lang: "de", text: p.part }),
          h("span", { class: "gloss" }, h("b", { text: p.meaning }), p.note ? ". " + p.note : "")));
      });
      var b = ety.bonus;
      main.appendChild(h("section", null,
        h("h2", { text: ety.title || "Where it comes from" }),
        eq.length > 0 && h("div", { class: "equation" }, eq),
        ety.literalMeaning && h("p", { class: "literal" }, "Put together: ", h("q", { text: ety.literalMeaning }), ety.summary ? ". " + ety.summary : ""),
        !ety.literalMeaning && ety.summary && h("p", { class: "prose", text: ety.summary }),
        ety.cognates && h("div", { class: "cognates", "aria-label": "Related words" }, ety.cognates.map(function (c) {
          return h("div", { class: "cognate" },
            h("span", { class: "lang", text: c.language }),
            h("span", { class: "word", text: c.word }),
            c.note && h("span", { class: "gloss", text: c.note }));
        })),
        b && h("div", { class: "aside" },
          h("h3", null, (b.label || "Bonus word") + ": ", h("span", { class: "de", lang: "de", text: b.word })),
          h("p", null, h("b", { text: b.meaning }), b.literalMeaning ? ", literally “" + b.literalMeaning + "”. " : ". ", b.note || ""))));
    }

    /* form tables: a cell "ein|en" shows stem ein with the ending en highlighted */
    arr(L.tables).forEach(function (t) {
      var cell = function (v) {
        var p = String(v).split("|");
        return p.length > 2 ? [p[0], h("mark", { text: p[1] }), p.slice(2).join("")] : p.length > 1 ? [p[0], h("mark", { text: p[1] })] : String(v);
      };
      main.appendChild(h("section", null,
        h("h2", { text: t.title }),
        t.intro && h("p", { class: "prose", text: t.intro }),
        h("div", { class: "table-wrap" }, h("table", { class: "decl" },
          h("thead", null, h("tr", null, h("th", { scope: "col" }, ""),
            arr(t.columns).map(function (c) { return h("th", { scope: "col", text: c }); }))),
          h("tbody", null, arr(t.rows).map(function (r) {
            return h("tr", null,
              h("th", { scope: "row" }, r.label, r.hint && h("span", { text: r.hint })),
              arr(r.cells).map(function (v) { return h("td", { lang: "de" }, cell(v)); }));
          })))),
        arr(t.notes).length > 0 && h("ul", { class: "patterns" }, t.notes.map(function (n) { return h("li", { text: n }); }))));
    });

    /* word family */
    var fam = arr(L.wordFamily);
    if (fam.length) main.appendChild(h("section", null,
      h("h2", { text: "The word family" }),
      h("div", { class: "table-wrap" }, h("table", null,
        h("thead", null, h("tr", null, h("th", { scope: "col", text: "German" }), h("th", { scope: "col", text: "Meaning" }), h("th", { scope: "col", text: "Word type" }))),
        h("tbody", null, fam.map(function (f) {
          return h("tr", null,
            h("td", { lang: "de", text: f.german }),
            h("td", null, f.english, f.literal && h("span", { class: "lit" }, " (literally “" + f.literal + "”)")),
            h("td", { text: f.type || "" }));
        }))))));

    var T = L.keyTrap;
    if (T) main.appendChild(h("section", null,
      h("h2", { text: T.title }),
      h("div", { class: "trap" },
        T.wrong && h("div", { class: "wrong-line" },
          h("span", { class: "struck", lang: "de", text: T.wrong.german }),
          h("span", { class: "red-note", text: T.wrong.verdict || ("This means “" + T.wrong.actualMeaning + "”") })),
        T.explanation && h("p", { text: T.explanation }),
        h("ul", { class: "right-list", "aria-label": "Correct ways to say it" }, arr(T.correct).map(function (c) {
          return h("li", null,
            h("span", { class: "de", lang: "de", text: c.german }),
            h("span", { class: "note" }, c.literal ? "Literally “" + c.literal + "” " : "", c.note || ""));
        })))));

    /* common mistakes */
    var ms = arr(L.commonMistakes);
    if (ms.length) main.appendChild(h("section", null,
      h("h2", { text: T ? "Other common slip-ups" : "Good to know" }),
      h("div", { class: "mistakes" }, ms.map(function (m) {
        return h("div", { class: "mistake" },
          h("h3", { text: m.title }),
          m.explanation && h("p", { text: m.explanation }),
          (m.wrong || m.correct) && h("p", { class: "fix", lang: "de" },
            m.wrong && h("span", { class: "x", "aria-label": "Wrong: " + m.wrong, text: m.wrong }),
            m.correct && h("span", { class: "ok", text: m.correct })),
          m.examples && h("ul", { class: "examples" }, m.examples.map(function (e) {
            return h("li", null, h("span", { class: "de", lang: "de" }, highlightEnding(e.german, head, e.highlight)),
              h("span", { class: "en", text: "  " + e.english }));
          })),
          m.forms && h("div", { class: "forms" },
            (Array.isArray(m.forms) ? m.forms.map(function (f) { return [f.value, f.label]; })
              : [["positive", "Basic"], ["comparative", "More"], ["superlative", "Most"]].map(function (k) { return [m.forms[k[0]], k[1]]; }))
            .map(function (k) {
              return k[0] && h("div", null, h("span", { text: k[1] }), h("b", { lang: "de", text: k[0] }));
            })));
      }))));

    /* sample sentences */
    var ss = arr(L.sampleSentences);
    if (ss.length) {
      var stems = [];
      if (head) stems.push(head.slice(0, Math.max(4, head.length - 2)).replace(/[^\wäöüß]/gi, ""));
      fam.forEach(function (f) {
        var w = String(f.german).split(" ").pop().toLowerCase();
        if (w.length > 5) stems.push(w.slice(0, -2));
      });
      stems = stems.filter(function (s, i) { return s && stems.indexOf(s) === i; });
      var list = h("ul", { class: "sentences" }, ss.map(function (s) {
        return h("li", { tabindex: "0" },
          h("span", { class: "de", lang: "de" }, s.highlight ? inkWords(s.german, s.highlight) : inkFamily(s.german, stems)),
          h("span", { class: "en", text: s.english }));
      }));
      var tbtn = h("button", { type: "button", class: "btn", "aria-pressed": "false", onclick: function () {
        var on = list.classList.toggle("hide-en");
        tbtn.setAttribute("aria-pressed", String(on));
        tbtn.textContent = on ? "Show translations" : "Hide translations";
      } }, "Hide translations");
      main.appendChild(h("section", null,
        h("div", { class: "sent-head" }, h("h2", { text: "Sample sentences" }), tbtn),
        list));
    }

    /* quiz */
    var qs = arr(L.quiz);
    if (qs.length) {
      var norm = function (s) { return String(s).trim().toLowerCase().replace(/[.!?]+$/, ""); };
      main.appendChild(h("section", null,
        h("h2", { text: "Quick check" }),
        h("ol", { class: "quiz" }, qs.map(function (q, qi) {
          var id = "q-" + (q.id || qi);
          var answer = h("div", { class: "answer", id: id + "-answer", hidden: true },
            arr(q.acceptedAnswers).concat(q.fullAnswer ? [q.fullAnswer] : []).map(function (a) {
              return h("span", { class: "de", lang: "de", text: a });
            }),
            q.explanation && h("span", { class: "note", text: q.explanation }));
          var showBtn = h("button", { type: "button", class: "btn", "aria-controls": id + "-answer", "aria-expanded": "false", onclick: function () {
            var open = answer.hidden;
            answer.hidden = !open;

          var body = h("div", { class: "body" }, h("p", { text: q.prompt }));
          if (q.type === "choice") {
            var cfb = h("p", { class: "feedback", "aria-live": "polite" });
            var opts = h("div", { class: "row", role: "group", "aria-label": "Answer options" });
            arr(q.options).forEach(function (o) {
              var b = h("button", { type: "button", class: "btn opt", lang: "de", onclick: function () {
                var right = norm(o) === norm(q.answer);
                [].forEach.call(opts.children, function (x) { x.classList.remove("picked-good", "picked-bad"); });
                b.classList.add(right ? "picked-good" : "picked-bad");
                cfb.className = "feedback " + (right ? "good" : "bad");
                cfb.textContent = right ? "Richtig! " + (q.explanation || "") : "Not quite. Try another one.";
              } }, o);
              opts.appendChild(b);
            });
            body.appendChild(opts);
            body.appendChild(cfb);
          } else if (q.type === "fill-in-the-blank") {
            var input = h("input", { id: id + "-input", type: "text", autocomplete: "off", spellcheck: "false", "aria-label": "Your answer" });
            var fb = h("p", { class: "feedback", "aria-live": "polite" });
            var check = function () {
              if (!input.value.trim()) { fb.className = "feedback bad"; fb.textContent = "Type the missing ending first."; return; }
              var ok = [q.answer, q.fullAnswer].concat(arr(q.acceptedAnswers)).filter(Boolean).map(norm);
              if (ok.indexOf(norm(input.value)) >= 0) {
                fb.className = "feedback good"; fb.textContent = "Richtig! " + (q.fullAnswer || "");
              } else {
                fb.className = "feedback bad"; fb.textContent = "Not quite. Try again, or show the answer.";
              }
            };
            input.addEventListener("keydown", function (e) { if (e.key === "Enter") check(); });
            body.appendChild(h("div", { class: "row" }, input, h("button", { type: "button", class: "btn primary", onclick: check }, "Check"), showBtn));
            body.appendChild(fb);
          } else {
            body.appendChild(h("div", { class: "row" }, showBtn));
          }
          body.appendChild(answer);
          return h("li", null, body);
        }))));
    }

    /* memory hook */
    if (L.memoryHook || L.signOff) main.appendChild(h("footer", { class: "hook" },
      L.memoryHook && h("h2", { text: "Remember it" }),
      L.memoryHook && h("p", { class: "big", text: L.memoryHook }),
      L.signOff && h("p", { class: "signoff", lang: "de", text: L.signOff })));

    document.getElementById("json-view").textContent = JSON.stringify(L, null, 2);
  }

  var errBox = document.getElementById("error");
  function showError(msg) { errBox.textContent = msg; errBox.hidden = !msg; }

  /* several lessons: a picker, routed on the URL hash (#anrufen) */
  var lessons = [];
  function slugOf(L) {
    return String(L.word.headword).toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
      .replace(/ß/g, "ss").replace(/[^a-z0-9-]+/g, "-");
  }
  function showFromHash() {
    var want = location.hash.slice(1);
    var L = lessons.filter(function (x) { return slugOf(x) === want; })[0] || lessons[0];
    render(L);
    var links = document.querySelectorAll("#picker a");
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute("href") === "#" + slugOf(L)) links[i].setAttribute("aria-current", "page");

  }
  document.getElementById("find").addEventListener("input", function (e) {
    var q = e.target.value.trim().toLowerCase().replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u")
      .replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u").replace(/ß/g, "ss");
    var shown = 0;
    [].forEach.call(document.querySelectorAll("#picker a"), function (a) {
      var hit = !q || a._keys.some(function (k) { return k.indexOf(q) === 0 || k.split(/\s+/).some(function (p) { return p.indexOf(q) === 0; }); });
      a.hidden = !hit; if (hit) shown++;
    });
    document.getElementById("find-count").textContent = q ? (shown ? shown + " found" : "No match. Check the spelling or try the base form.") : lessons.length + " words";
  });
  window.addEventListener("hashchange", function () { if (lessons.length > 1) { showFromHash(); window.scrollTo(0, 0); } });

  function load(text, source) {
    var data;
    try { data = JSON.parse(text); }
    catch (e) { showError(source + " isn't valid JSON: " + e.message + ". Fix the file and open it again."); return; }
    var list = Array.isArray(data) ? data : [data];
    var bad = list.filter(function (x) { return !x || !x.word || !x.word.headword; });
    if (!list.length || bad.length) {
      showError(source + " has a lesson without word.headword, so it can't be shown. Check it follows the lesson schema.");
      return;
    }
    showError("");
    lessons = list;
    var nav = document.getElementById("picker");
    nav.textContent = "";
    nav.hidden = list.length < 2;
    document.getElementById("finder").hidden = list.length < 12;
    var fold = function (s) { return String(s).toLowerCase().replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u")
      .replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u").replace(/ß/g, "ss").replace(/^\(sich\)\s*/, ""); };
    list.forEach(function (x) {
      var a = h("a", { href: "#" + slugOf(x), class: x.lessonType === "card" ? "card-word" : null, text: x.word.headword });
      a._keys = [x.word.headword].concat(arr(x.forms)).concat(arr(x.wordFamily).map(function (f) { return f.german; })).map(fold);
      nav.appendChild(a);
    });
    document.getElementById("find-count").textContent = list.length + " words";
    showFromHash();
  }

  load(document.getElementById("lesson-data").textContent, "The built-in lesson");

  document.getElementById("file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () { load(String(r.result), f.name); window.scrollTo(0, 0); };
    r.onerror = function () { showError(f.name + " couldn't be read. Try opening it again."); };
    r.readAsText(f);
    e.target.value = "";
  });

  var jbtn = document.getElementById("toggle-json"), jv = document.getElementById("json-view");
  jbtn.addEventListener("click", function () {
    var open = jv.hidden;
    jv.hidden = !open;
    jbtn.setAttribute("aria-expanded", String(open));
    jbtn.textContent = open ? "Hide JSON" : "Show JSON";
  });
})();
